(c) Sketch graphs of the rod's speed and of the current in the circuit versus time.
(d) Explain, using energy, why the rod slows down, and relate this to your graphs.`,
  [
    { pts: 1, t: '(a) A single horizontal magnetic force on the rod, opposite to its velocity.', kw: ['magnetic|ilb|i ?l ?b|force', 'opposite|backward|opposes|against'] },
    { pts: 1, t: '(a) No forward “force of motion”; vertical forces (if shown) balance.', kw: ['no (forward|other)|only|balance|normal'] },
    { pts: 1, t: '(b) ε = Bℓv and I = Bℓv/R.', kw: ['b ?ℓ ?v|b ?l ?v|blv'] },
    { pts: 1, t: '(b) F = IℓB = B²ℓ²v/R opposing the motion: m dv/dt = −B²ℓ²v/R.', kw: ['b\\^?2|b²', 'dv ?/ ?dt|dv/dt'] },
    { pts: 1, t: '(b) v(t) = v₀e^(−B²ℓ²t/(mR)).', kw: ['e\\^|exp'] },
    { pts: 1, t: '(c) Speed decays exponentially from v₀ toward zero.', kw: ['exponential|decay', 'speed|velocity'] },
    { pts: 1, t: '(c) Current also decays exponentially from Bℓv₀/R.', kw: ['current'] },
    { pts: 1, t: '(c) Both graphs have the same time constant mR/(B²ℓ²).', kw: ['same time constant|m ?r ?/ ?\\(?b|time constant'] },
    { pts: 1, t: '(d) The rod’s kinetic energy is converted to thermal energy in the resistor (I²R).', kw: ['thermal|heat|i\\^?2 ?r|i²r|dissipat'] },
    { pts: 1, t: '(d) The rate of energy loss, B²ℓ²v²/R, depends on v.', kw: ['v\\^?2|v²|depends on (the )?speed|proportional'] },
    { pts: 1, t: '(d) As the rod slows, it loses energy more slowly, so the speed graph flattens (never quite reaching zero).', kw: ['slower|flatten|less steep|levels|asymptot|never'] },
    { pts: 1, t: '(d) Consistent with Lenz’s law: the induced current opposes the change in flux.', kw: ['lenz|oppos'] },
  ],
  `(a) One horizontal force acts on the rod: the magnetic force IℓB, pointing opposite to its velocity. (Gravity and the normal force are vertical and balance.)
(b) The motional emf is ε = Bℓv, so I = Bℓv/R. The magnetic force is F = IℓB = B²ℓ²v/R, opposing the motion. m dv/dt = −(B²ℓ²/R)v → v(t) = v0 e^(−B²ℓ²t/(mR)).

P('pce-lab-cap', 'pce-lab', 'Experimental design and analysis', 10, ['11'], 'Measuring a capacitance with an RC circuit',
  `Students charge a capacitor to 10.0 V, then discharge it through a 100 kΩ resistor while recording the capacitor voltage.\n\n` + T([['t (s)', '0', '2', '4', '6', '8'], ['V (V)', '10.0', '6.70', '4.49', '3.01', '2.02']]),
  `(a) Describe how the students could collect these data using common laboratory equipment.
(b) Identify quantities to graph to obtain a straight line, and explain how the capacitance can be found from it.
(c) Plot your chosen quantities and draw a best-fit line. (Describe it if you cannot draw it.)
(d) Calculate the capacitance.
(e) The voltmeter used has a resistance of 1.0 MΩ. Explain how this affects the calculated capacitance.`,
  [
    { pts: 1, t: '(a) Voltmeter (or voltage sensor) connected in parallel with the capacitor.', kw: ['voltmeter|sensor|probe', 'parallel|across'] },
    { pts: 1, t: '(a) Disconnects the battery (switch) at t = 0 and records V at regular time intervals.', kw: ['switch|disconnect|interval|timer|stopwatch|data logger'] },
    { pts: 1, t: '(b) Graph ln V vs. t.', kw: ['ln|natural log|log'] },
    { pts: 1, t: '(b) Slope = −1/(RC), so C = −1/(R × slope).', kw: ['-1 ?/ ?\\(?rc|−1 ?/ ?\\(?rc|1/rc|slope'] },
    { pts: 1, t: '(c) ln V values (2.30, 1.90, 1.50, 1.10, 0.70) plotted versus t with a straight best-fit line.', kw: ['straight|best.?fit|line'] },
    { pts: 1, t: '(d) Slope ≈ −0.20 s⁻¹.', num: [-0.2, 0.05] },
    { pts: 1, t: '(d) RC = 5.0 s.', num: [5.0, 0.05] },
    { pts: 1, t: '(d) C = 5.0 s/(1.0 × 10⁵ Ω) = 5.0 × 10⁻⁵ F (50 µF).', num: [5.0e-5, 0.05] },
    { pts: 1, t: '(e) The voltmeter provides a parallel discharge path, so the effective resistance is smaller than 100 kΩ (about 91 kΩ).', kw: ['parallel', 'smaller|less|lower|91'] },
    { pts: 1, t: '(e) Using 100 kΩ in the calculation underestimates C (the true C is larger).', kw: ['underestimat|too (small|low)|smaller|larger true|actual (c|capacitance) (is )?(larger|greater)'] },
  ],
  `(a) Charge the capacitor with a 10.0 V supply, then open the switch so it discharges through the 100 kΩ resistor. Connect a voltmeter (or voltage probe with a data logger) across the capacitor and record its voltage every 2 s.
(b) V = V0 e^(−t/RC), so ln V = ln V0 − t/(RC). Graph ln V versus t; the slope is −1/(RC), so C = −1/(R × slope).
(c) ln V: 2.30, 1.90, 1.50, 1.10, 0.70 at t = 0, 2, 4, 6, 8 s. These lie on a straight line.
(d) Slope = (0.70 − 2.30)/8 = −0.20 s^-1. RC = 5.0 s, so C = 5.0/(1.0 × 10^5) = 5.0 × 10^-5 F = 50 µF.
(e) The voltmeter's 1.0 MΩ is in parallel with the 100 kΩ resistor, so the capacitor actually discharges through about 91 kΩ. The measured time constant is RC with that smaller R, so dividing by 100 kΩ gives a capacitance that is too small; the true C is about 55 µF.`);

P('pce-lab-solenoid', 'pce-lab', 'Experimental design and analysis', 10, ['12'], 'Field inside a solenoid',

H('8', `A nonuniform charge density ρ(r) = ar (for r < R) fills a sphere. The total charge is`, [`πaR⁴`, `(4/3)πaR⁴`, `4πaR³`, `aR²`], `Q = ∫₀ᴿ ar · 4πr² dr = 4πa R⁴/4 = πaR⁴.`);
S('8', `An electric dipole in a uniform field experiences`, [`a torque but no net force`, `a net force but no torque`, `neither force nor torque`, `a force along the field only`], `The forces on +q and −q are equal and opposite, so they cancel, but they act at different points and produce a torque.`);
/* 9 */
S('9', `The electric potential energy of two charges +q and −q separated by r is`, [`−kq²/r`, `+kq²/r`, `−kq²/r²`, `zero`], `U = kq₁q₂/r with opposite signs is negative.`);

H('9', `A uniform field E = 200 N/C points in +x. Point B is 0.30 m in +x from point A. V<sub>B</sub> − V<sub>A</sub> is`, [`−60 V`, `+60 V`, `−667 V`, `0 V`], `ΔV = −EΔx = −200(0.30) = −60 V. Potential drops along the field.`);

H('9', `${T([['x (m)', '0', '0.1', '0.2', '0.3'], ['V (V)', '50', '30', '10', '−10']])}What is the electric field in this region?`, [`200 V/m in the +x direction`, `200 V/m in the −x direction`, `20 V/m in the +x direction`, `It is zero`], `V decreases by 20 V every 0.1 m: dV/dx = −200 V/m, so E<sub>x</sub> = +200 V/m.`);

H('11', `A battery's terminal voltage is 11.4 V when it supplies 2.0 A and 12.0 V with no current. Its internal resistance is`, [`0.30 Ω`, `0.60 Ω`, `5.7 Ω`, `6.0 Ω`], `ε − Ir = 11.4 with ε = 12.0: r = 0.60/2.0 = 0.30 Ω.`);
S('11', `A current of 3.0 A flows through a 4.0 Ω resistor. The potential difference across it is`, [`12 V`, `0.75 V`, `1.3 V`, `7.0 V`], `Ohm's law: ΔV = IR = (3.0 A)(4.0 Ω) = 12 V.`);

    { pts: 1, t: '(e) a = g = 9.8 m/s² at t = 0, because v = 0 so the drag force is zero.', kw: ['9\\.8|g\\b', 'v ?= ?0|no drag|drag (is )?zero|at rest'] },
  ],
  `(a) Forces: weight mg down and drag bv up. m dv/dt = mg − bv.
(b) At terminal speed the acceleration is zero: mg = bvT, so vT = mg/b = (0.50)(9.8)/0.25 = 19.6 m/s.
(c) dv/(mg − bv) = dt/m. Integrating from v = 0 at t = 0: −(1/b) ln[(mg − bv)/mg] = t/m, so mg − bv = mg e^(−bt/m) and v(t) = (mg/b)(1 − e^(−bt/m)).
(d) Half of terminal speed: 1 − e^(−bt/m) = ½ → e^(−bt/m) = ½ → t = (m/b) ln 2 = (0.50/0.25)(0.693) = 1.4 s.
(e) At t = 0 the ball is at rest, so the drag force bv is zero and the only force is gravity: a = g = 9.8 m/s² downward.`);

P('pcm-tbr-shm', 'pcm-tbr', 'Translation between representations', 12, ['7'], 'Graphs of simple harmonic motion',

P('pcm-tbr-orbit', 'pcm-tbr', 'Translation between representations', 12, ['2', '3'], 'Satellites in circular orbits',

  [

    { pts: 1, t: '(b) Uses T = 2πr/v.', kw: ['2 ?π ?r|2πr|2 ?pi ?r'] },

P('pcm-qqt-friction', 'pcm-qqt', 'Qualitative/quantitative translation', 8, ['2', '3'], 'Stopping distance on a rough floor',
  `A block slides across a horizontal floor with initial speed v₀ and comes to rest because of kinetic friction (coefficient μ).`,
  `(a) Without writing or using equations, predict how the stopping distance changes if the block's mass is doubled (same v₀ and μ). Explain your reasoning.
(b) Derive an expression for the stopping distance d in terms of v₀, μ, and physical constants.
(c) Explain how your expression is consistent with part (a).`,
  [
    { pts: 1, t: '(a) The stopping distance stays the same.', kw: ['same|unchanged|no change|equal'] },
    { pts: 1, t: '(a) Doubling the mass doubles the friction force (normal force doubles).', kw: ['friction', 'double|twice|larger|more'] },
    { pts: 1, t: '(a) But it also doubles the inertia (or kinetic energy), so the deceleration is unchanged.', kw: ['inertia|kinetic energy|deceleration|acceleration|harder to stop'] },
    { pts: 1, t: '(b) Friction force μmg (or work–energy: μmgd = ½mv₀²).', kw: ['μ ?m ?g|mu ?m ?g|μmg|umg'] },
    { pts: 1, t: '(b) Mass cancels: a = μg.', kw: ['cancel|μ ?g|mu ?g'] },
    { pts: 1, t: '(b) d = v₀²/(2μg).', kw: ['2 ?μ ?g|2 ?mu ?g|2μg|2ug'] },
    { pts: 1, t: '(c) Mass does not appear in the expression.', kw: ['mass (does not|doesn.?t) appear|no m|independent of (the )?mass|not depend'] },
    { pts: 1, t: '(c) So the stopping distance does not depend on mass, matching part (a).', kw: ['consistent|match|agree|same'] },
  ],
  `(a) The stopping distance stays the same. Doubling the mass doubles the normal force and so doubles the friction force. But the block also has twice the inertia (and twice the kinetic energy at the same speed), so it slows down at the same rate and slides the same distance.
(b) Friction: f = μmg. Work–energy: −μmgd = 0 − ½mv0². The mass cancels: d = v0²/(2μg).
(c) The mass m does not appear in d = v0²/(2μg), so changing the mass does not change the stopping distance, which matches part (a).`);

P('pcm-qqt-race', 'pcm-qqt', 'Qualitative/quantitative translation', 8, ['6'], 'Rolling race: hoop versus disk',
  `A hoop (I = MR²) and a solid disk (I = ½MR²) with the same mass and radius are released from rest at the top of the same ramp of height h and roll without slipping.`,
  `(a) Without writing or using equations, predict which object reaches the bottom first, and explain your reasoning.
(b) For an object with I = βMR², derive an expression for its speed at the bottom in terms of β, g, and h.
(c) Explain how your expression in part (b) is consistent with your prediction in part (a).`,
  [
    { pts: 1, t: '(a) The disk reaches the bottom first.', kw: ['disk|disc'] },
    { pts: 1, t: '(a) Both convert the same gravitational potential energy (same mass and height).', kw: ['same (potential )?energy|same height|mgh|potential'] },
    { pts: 1, t: '(a) The hoop’s mass is farther from the axis, so a larger share of its energy goes into rotation and less into translation.', kw: ['rotation|rotational|spin', 'translat|less (energy|speed)|slower'] },
    { pts: 1, t: '(b) Energy: Mgh = ½Mv² + ½Iω².', kw: ['mgh', '½ ?i ?ω|1/2 ?iω|rotational'] },
    { pts: 1, t: '(b) Rolling without slipping: ω = v/R.', kw: ['v ?/ ?r|ω ?= ?v|omega ?= ?v'] },
    { pts: 1, t: '(b) v = √(2gh/(1 + β)).', kw: ['1 ?\\+ ?β|1 ?\\+ ?beta|1\\+β'] },
    { pts: 1, t: '(c) Larger β (hoop, β = 1) gives a smaller v than the disk (β = ½).', kw: ['larger β|larger beta|β ?= ?1|hoop.{0,40}(slower|smaller|less)|smaller'] },
    { pts: 1, t: '(c) So the disk is faster at every point and wins, matching part (a).', kw: ['consistent|match|agree|disk'] },
  ],
  `(a) The disk wins. Both start with the same gravitational potential energy (same mass and height). The hoop has all its mass at the rim, so more of its energy must go into spinning, leaving less for moving down the ramp. The disk keeps a larger share as translational kinetic energy, so it moves faster.
(b) Mgh = ½Mv² + ½(βMR²)(v/R)² = ½Mv²(1 + β). So v = √(2gh/(1 + β)).
(c) β appears in the denominator. The hoop (β = 1) gets v = √(gh), while the disk (β = ½) gets v = √(4gh/3), which is larger. The disk is faster at every height, so it reaches the bottom first, matching part (a).`);

function createProfile(raw) {

  if (!name) return renderProfiles('Enter a username.');
  if (name.length > 24) return renderProfiles('Use 24 characters or fewer.');
  const list = profiles();
  if (list.some(p => p.name.toLowerCase() === name.toLowerCase())) return renderProfiles(`The username "${name}" is already taken on this computer.`);
  const first = !list.length;
  const id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  list.push({ id, name, created: new Date().toISOString() }); LS.set('ap.profiles', list);

}

function admBind() {

/* ═══════════ MODALS & HELP ═══════════ */
function closeModal() { $('#modal-root').innerHTML = ''; }
function confirmBox(title, body, ok, onOk) {

  $('#cfNo').onclick = closeModal; $('#cfOk').onclick = () => { closeModal(); onOk(); }; $('#cfOk').focus();
  $('#scrim').onclick = e => { if (e.target.id === 'scrim') closeModal(); };
}
function pos(z) {

}
const NONMET = new Set([1, 6, 7, 8, 9, 15, 16, 17, 34, 35, 53]), NOBLE = new Set([2, 10, 18, 36, 54, 86, 118]);

/* scientific calculator: tokenizer + recursive-descent parser (no eval) */
const CALC = { expr: '', out: '', deg: true, ans: 0 };
function calcEval(src) {

    asin: x => { const r = Math.asin(x); return CALC.deg ? r * 180 / Math.PI : r; }, acos: x => { const r = Math.acos(x); return CALC.deg ? r * 180 / Math.PI : r; }, atan: x => { const r = Math.atan(x); return CALC.deg ? r * 180 / Math.PI : r; },

function bindCalc() {

  $$('[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k;

    return `<div class="ptwrap"><div class="pt">${cells}</div></div><p class="small muted" style="margin:10px 0 0">Atomic masses in g/mol. Values in parentheses are mass numbers of the most stable isotope. Shaded: nonmetals and noble gases.</p>`;
