<style>
/* ───── test page ───── */
.t-head { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 40px; align-items: end; padding-bottom: 22px; border-bottom: 1px solid var(--ink); }
.t-head .code-big { font-family: var(--font-display); font-style: italic; color: var(--accent); font-size: 20px; }
.specs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.specs div { padding: 10px 12px 4px 0; min-width: 0; }
.specs b { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 500; line-height: 1.1; }
.specs small { color: var(--muted); font-size: 12px; }
.modes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; border-bottom: 1px solid var(--line); }
.mode { padding: 26px 28px 26px 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.mode + .mode { padding-left: 28px; padding-right: 0; border-left: 1px solid var(--line); }
.mode h3 { font-family: var(--font-display); font-weight: 500; font-size: 28px; margin: 0; line-height: 1.1; }
.mode .tag-m { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ember); }
.mode p { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 52ch; }

.resume { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; margin: 18px 0 0; }
.resume p { margin: 0 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }

.seg input:focus-visible + span { outline: 2px solid var(--ember); outline-offset: -2px; }
.lvl-note { font-size: 13.5px; color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.stats3 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 36px; padding-top: 26px; }
.blueprint { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.blueprint li { display: grid; grid-template-columns: 34px minmax(0, 1fr) 50px; gap: 10px; align-items: center; }
.roman { font-family: var(--font-display); font-style: italic; color: var(--accent); font-size: 17px; }
.bp-name { font-size: 14px; min-width: 0; }
.bar { height: 5px; background: var(--sunk); overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.lo { background: var(--bad); } .bar i.mid { background: var(--mark); } .bar i.hi { background: var(--good); }
.pct { font-family: var(--font-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
.hist th { text-align: left; font-weight: 500; color: var(--muted); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; padding: 6px 8px; border-bottom: 1px solid var(--ink); }
.hist td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
.trend svg { width: 100%; height: auto; display: block; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; background: var(--sunk); color: var(--muted); }
.pill.hard { background: var(--mark-soft); color: var(--mark); }
.pill.prac { background: var(--accent-soft); color: var(--accent); }
.spark { display: block; width: 100%; height: 36px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.kv div { padding: 8px 10px 0 0; min-width: 0; }

/* ───── exam console: quiet, no decoration ───── */
#exam { min-height: 100%; display: flex; flex-direction: column; background: var(--surface); }
.xbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--ink); }
.xtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 24px; }
.xtitle { font-weight: 600; font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xtitle span { color: var(--muted); font-weight: 500; }
.timer { display: flex; align-items: center; gap: 10px; }
.timer .t { font-family: var(--font-mono); font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; }
.timer .lbl { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.timer.warn .t { color: var(--mark); } .timer.crit .t { color: var(--bad); }
.xtools { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 24px 10px; border-top: 1px solid var(--line); }
.qcount { font-family: var(--font-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.qcount .score-run { color: var(--accent); margin-left: 12px; }
.tbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.tb { min-height: 34px; padding: 0 12px; border-radius: 3px; border: 1px solid var(--rule); background: transparent; color: var(--ink); font-weight: 600; font-size: 13px; cursor: pointer; }
.tb:hover { border-color: var(--ink); }
.tb:disabled { opacity: .4; cursor: default; }
.tb.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tb.on { background: var(--mark-soft); border-color: var(--mark); color: var(--ink); }
.tb.link { border-color: transparent; color: var(--muted); }
.progress { height: 3px; background: var(--sunk); }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.xbody { flex: 1; padding-inline: 24px; padding-block: 36px 72px; }
.qcol { max-width: 760px; margin: 0 auto; }
.qmeta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 18px; margin-bottom: 12px; font-size: 12.5px; color: var(--muted); }
.flag { display: inline-flex; gap: 5px; align-items: center; color: var(--mark); font-weight: 600; }
.stem { font-family: var(--font-q); font-size: 20px; line-height: 1.55; margin: 0 0 24px; }
.stem table.data, .rv-stem table.data { font-family: var(--font-ui); font-size: 14px; border-collapse: collapse; margin: 14px 0 4px; display: block; overflow-x: auto; max-width: 100%; }
table.data th, table.data td { border: 1px solid var(--line); padding: 6px 12px; text-align: center; font-variant-numeric: tabular-nums; }
table.data th { background: var(--sunk); font-weight: 600; }
blockquote.src { margin: 4px 0 14px; padding: 10px 16px; border-left: 3px solid var(--line); background: var(--sunk); font-style: italic; max-width: 62ch; }
blockquote.src cite { display: block; margin-top: 6px; font-style: normal; font-family: var(--font-ui); font-size: 13px; color: var(--muted); }
blockquote.src cite::before { content: "— "; }
.aud-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 6px 0 10px; }
[data-play].on { background: var(--ink) !important; border-color: var(--ink) !important; }
.speak { border: 1px solid var(--line); border-left: 4px solid var(--accent); background: var(--surface); padding: 12px 16px; margin: 14px 0; }
.sp-h { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.sp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.sp-phase { font-weight: 700; } .sp-phase.prep { color: var(--mark); } .sp-phase.talk { color: var(--good); } .sp-phase.listen { color: var(--accent); }
.sp-t { font-size: 22px; } .sp-turn { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); } .sp-text { margin-top: 6px; font-family: var(--font-q); font-size: 17px; }
.psg-tab { font-family: var(--font-ui); font-size: 14px; margin: 4px 0 12px; } .psg-tab td, .psg-tab th { padding: 5px 10px; }
.choices { display: grid; gap: 10px; }
.choice { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: start; text-align: left; width: 100%; padding: 13px 15px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); cursor: pointer; font-family: var(--font-q); font-size: 17.5px; line-height: 1.45; transition: border-color .12s, background .12s; }
.choice:hover { border-color: var(--ink); }
.choice .ov { width: 22px; height: 22px; margin-top: 2px; border: 1.5px solid var(--ink); border-radius: 50%; display: grid; place-items: center; }
.choice.multi .ov { border-radius: 3px; }
.choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice[aria-checked="true"] .ov { border-color: var(--accent); background: var(--accent); }
.choice[aria-checked="true"] .ov::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink); }
.choice.multi[aria-checked="true"] .ov::after { width: 10px; height: 6px; border-radius: 0; background: none; border-left: 2.5px solid var(--accent-ink); border-bottom: 2.5px solid var(--accent-ink); transform: rotate(-45deg) translate(1px, -1px); }
.choice .ltr { font-family: var(--font-ui); font-weight: 600; margin-right: 4px; }
.choice .verdict { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding-top: 4px; }
.choices.locked .choice { cursor: default; }
.choices.locked .choice:hover { border-color: var(--line); }
.choice.is-right { border-color: var(--good); background: var(--good-soft); }
.choice.is-right .verdict { color: var(--good); }
.choice.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.is-wrong .verdict { color: var(--bad); }
.nuc { display: inline-flex; flex-direction: column; font-size: .68em; line-height: 1.05; text-align: right; vertical-align: -0.35em; margin-right: 1px; }
.qnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
.kbd { font-size: 12px; color: var(--muted); margin-top: 18px; font-family: var(--font-mono); }
.answerbar { margin-top: 16px; padding: 9px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; font-size: 13.5px; color: var(--muted); }
/* practice-mode feedback */
.fb { margin-top: 20px; border-left: 4px solid var(--good); background: var(--good-soft); padding: 14px 18px; }
.fb.no { border-left-color: var(--bad); background: var(--bad-soft); }
.fb h4 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 500; font-size: 22px; }
.fb p { margin: 0 0 8px; }
.fb .tip { font-size: 13.5px; color: var(--muted); margin: 8px 0 0; }
.sw { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; margin: 0 0 16px; }
.sw h3 { margin: 0 0 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.sw ul { margin: 0; padding-left: 18px; } .sw li { margin: 2px 0; }
@media (max-width: 560px) { .sw { grid-template-columns: 1fr; gap: 10px; } }
.rv-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
.rv-head h2 { font-family: var(--font-display); font-size: 30px; margin: 0; font-weight: 500; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; background: var(--sunk); border: 1px solid var(--line); }
.legend .a::before { background: var(--accent-soft); border-color: var(--accent); }
.legend .m::before { background: var(--mark-soft); border-color: var(--mark); }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; }
.qcell { position: relative; min-height: 44px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); font-family: var(--font-mono); font-size: 14px; font-weight: 500; cursor: pointer; font-variant-numeric: tabular-nums; }
.qcell:hover { border-color: var(--ink); }
.qcell.ans { background: var(--accent-soft); border-color: var(--accent); }
.qcell.unseen { color: var(--muted); }
.qcell.mk::after { content: ""; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--mark); }
.rv-sum { display: flex; gap: 22px; flex-wrap: wrap; margin: 6px 0 18px; font-size: 14px; }
.rv-sum b { font-family: var(--font-mono); font-size: 18px; }

/* ───── results ───── */
.score { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: center; padding-bottom: 26px; border-bottom: 1px solid var(--ink); }
.ring { width: 150px; height: 150px; }
.score h1 { font-family: var(--font-display); font-weight: 500; font-size: clamp(28px, 4vw, 40px); margin: 6px 0 8px; line-height: 1.1; }
.catrow { display: grid; grid-template-columns: 40px minmax(0, 1fr) 80px 54px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 26px 0 14px; }
.chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink); }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.rv { border-top: 1px solid var(--ink); padding: 18px 0 22px; }
.rv-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
.tag { padding: 2px 8px; border-radius: 2px; font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.tag.ok { background: var(--good-soft); color: var(--good); } .tag.no { background: var(--bad-soft); color: var(--bad); } .tag.skip { background: var(--sunk); color: var(--muted); }
.rv-stem { font-family: var(--font-q); font-size: 17px; margin-bottom: 10px; }
.rv-ch { display: grid; gap: 4px; margin: 0 0 10px; padding: 0; list-style: none; font-family: var(--font-q); font-size: 16px; }
.rv-ch li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; padding: 6px 8px; align-items: start; }
.rv-ch li.c { background: var(--good-soft); } .rv-ch li.w { background: var(--bad-soft); }
.rv-ch .lt { font-family: var(--font-mono); font-size: 13px; color: var(--muted); padding-top: 2px; }
.rv-ch .note2 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding-top: 4px; }
.rv-ch li.c .note2 { color: var(--good); } .rv-ch li.w .note2 { color: var(--bad); }
.rat { background: var(--sunk); padding: 12px 16px; margin-bottom: 12px; }
.rat-h { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.rat-h .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: var(--paper); font-size: 13px; font-weight: 700; flex: none; }
.rat-h .mk.ok { background: var(--good); } .rat-h .mk.no { background: var(--bad); } .rat-h .mk.skip { background: var(--muted); }
.rat p { margin: 0; font-size: 14.5px; }
.stem u, .rv-stem u { text-underline-offset: 3px; }
.ag-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ag-cat { margin: 16px 0 6px; font-size: 14.5px; font-weight: 600; }
.ag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px 10px; }
.ag { display: flex; align-items: center; justify-content: flex-end; gap: 6px; border: 0; background: none; padding: 4px 6px; cursor: pointer; font-family: var(--font-mono); font-size: 14px; color: var(--ink); }
.ag:hover { background: var(--sunk); }
.ag .ic { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--paper); flex: none; }
.ag .ic.ok { background: var(--good); } .ag .ic.no { background: var(--bad); } .ag .ic.skip { background: transparent; border: 1.5px solid var(--rule); color: var(--muted); }
.ag .ic.cr { background: var(--mark); } .ag .ic.cr.un { background: transparent; border: 1.5px dashed var(--mark); color: var(--mark); }

/* ───── modals, help tools ───── */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); color: var(--ink); border: 1px solid var(--ink); width: min(980px, 100%); max-height: calc(100% - 24px); overflow: auto; box-shadow: 10px 10px 0 rgba(0,0,0,.18); }
.modal.sm { width: min(480px, 100%); }
.mail-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 12px; }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
td.cbx, th.cbx { width: 34px; text-align: center; } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.cm-opts { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; } .cm-opts label { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: 13.5px; } .cm-opts input { min-width: 240px; }
.cm-item { border-top: 1px solid var(--line); padding: 14px 0; } .cm-h { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; margin-bottom: 4px; }
.cm-body { white-space: pre-wrap; font-family: var(--font-ui); font-size: 13.5px; background: var(--paper); border: 1px solid var(--line); padding: 12px 14px; margin: 8px 0 0; max-height: 300px; overflow: auto; }
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.mhead h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 21px; }
.mbody { padding: 18px; }
.mfoot { display: flex; justify-content: flex-end; gap: 10px; padding: 0 18px 18px; flex-wrap: wrap; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.menu { display: grid; gap: 8px; }
.menu .btn { justify-content: flex-start; width: 100%; border-color: var(--line); }
.btn.danger { color: var(--bad); }
.ptwrap { overflow-x: auto; padding-bottom: 6px; }
.pt { display: grid; grid-template-columns: repeat(18, minmax(42px, 1fr)); grid-template-rows: repeat(7, auto) 10px repeat(2, auto); gap: 3px; min-width: 800px; }
.el { border: 1px solid var(--line); padding: 3px 4px 4px; background: var(--paper); min-height: 52px; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.el .z { font-size: 9.5px; color: var(--muted); font-family: var(--font-mono); }
.el .s { font-weight: 700; font-size: 15px; line-height: 1.1; text-align: center; margin-top: 1px; }
.el .m { font-size: 9px; text-align: center; font-family: var(--font-mono); color: var(--muted); margin-top: auto; }
.el.nm { background: var(--chem-soft); } .el.ng { background: var(--sunk); }
.el.ph { border-style: dashed; background: transparent; justify-content: center; align-items: center; font-size: 10px; color: var(--muted); }
.const { width: 100%; border-collapse: collapse; font-size: 14px; }
.const td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.const td:last-child { font-family: var(--font-mono); font-size: 13.5px; }
.codewrap { overflow-x: auto; }
table.code { border-collapse: collapse; min-width: 640px; width: 100%; font-size: 13px; }
table.code th, table.code td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; }
table.code th { background: var(--sunk); font-family: var(--font-mono); font-size: 14px; }
table.code td div { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); }
table.code td div span:last-child { color: var(--muted); }
table.code td div.stop span:last-child { color: var(--bad); font-weight: 600; }
table.code td div.start span:last-child { color: var(--good); font-weight: 600; }
pre.code { font-family: var(--font-mono); font-size: 14px; line-height: 1.5; background: var(--sunk); border: 1px solid var(--line); padding: 10px 12px; overflow-x: auto; margin: 10px 0; white-space: pre; }
.numentry { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.numentry input { font-family: var(--font-mono); font-size: 20px; padding: 10px 12px; width: 200px; max-width: 100%; border: 1.5px solid var(--ink); border-radius: 2px; background: var(--surface); }
.numentry input:focus { border-color: var(--accent); outline: none; }
.numentry .unit { font-family: var(--font-q); font-size: 17px; }
.numhint { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.rv-num { font-family: var(--font-q); font-size: 15.5px; margin: 0 0 10px; display: grid; gap: 4px; }
.rv-num div { padding: 5px 8px; }
.rv-num .c { background: var(--good-soft); } .rv-num .w { background: var(--bad-soft); }
.calc { max-width: 380px; margin: 0 auto; }
.calc-disp { display: grid; gap: 4px; background: var(--sunk); border: 1px solid var(--line); padding: 10px 12px; margin-bottom: 10px; }
.calc-disp input { font-family: var(--font-mono); font-size: 18px; border: 0; background: transparent; width: 100%; outline: none; }
.calc-disp .res { font-family: var(--font-mono); font-size: 24px; font-weight: 600; text-align: right; min-height: 30px; overflow-x: auto; }
.calc-disp .res.err { color: var(--bad); font-size: 15px; }
.calc-keys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.calc-keys button { min-height: 40px; border: 1px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-size: 14.5px; cursor: pointer; }
.calc-keys button:hover { border-color: var(--ink); }
.calc-keys .op { background: var(--sunk); }
.calc-keys .eq { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.calc-opts { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); gap: 8px; flex-wrap: wrap; }
.ref h4 { margin: 14px 0 6px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: var(--font-mono); font-weight: 500; }
.ref h4:first-child { margin-top: 0; }

/* profiles, gate, admin */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 18px 0 28px; }
.pcard { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.pcard:hover { border-color: var(--ink); }
.pcard .av { width: 40px; height: 40px; font-size: 19px; }
.pcard b { display: block; font-size: 15px; }
.pcard small { color: var(--muted); }
.field { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field input { padding: 9px 12px; border-radius: 2px; border: 1px solid var(--rule); background: var(--surface); min-width: 0; flex: 1 1 220px; max-width: 320px; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 6px; }
.gate { max-width: 520px; margin: 0 auto; }
.gate form { display: grid; gap: 12px; }
.gate label { display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; }
.gate input, .admin-form input, .rep-form textarea, .rep-form select { padding: 10px 12px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); width: 100%; }
.gate input#gCode { font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
.admin-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0; }
.admin-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.admin-form input { flex: 1 1 220px; max-width: 360px; width: auto; }
table.adm { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.adm th { text-align: left; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--ink); font-weight: 500; }
table.adm td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.adm td.mono { white-space: nowrap; }
.chip-s { display: inline-block; padding: 2px 8px; margin: 2px 4px 2px 0; border-radius: 999px; background: var(--sunk); font-size: 12px; white-space: nowrap; }
.chip-s b { font-family: var(--font-mono); }
.st-on { color: var(--good); font-weight: 600; } .st-off { color: var(--bad); font-weight: 600; }
.mdetail { background: var(--paper); padding: 10px 12px; margin-top: 8px; }
.live-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.rep-form { display: grid; gap: 12px; }
.rep-form label { display: grid; gap: 6px; font-size: 13.5px; font-weight: 600; }
.rep-form textarea { min-height: 120px; resize: vertical; }

/* reading passages */
.psplit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; max-width: 1240px; margin: 0 auto; align-items: start; }
.psplit .qcol { max-width: none; margin: 0; }
.psg { position: sticky; top: 132px; max-height: calc(100vh - 160px); overflow: auto; background: var(--paper); border: 1px solid var(--line); padding: 20px 22px; }
.psg-h { display: grid; gap: 2px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.psg-h b { font-family: var(--font-display); font-weight: 500; font-size: 19px; } .psg-h small { color: var(--muted); font-size: 12px; }
.psg-t { font-family: var(--font-q); font-size: 17px; line-height: 1.7; }
.psg-t p { margin: 0 0 12px; }
details.rv-psg { margin: 0 0 10px; } details.rv-psg summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 13.5px; }
details.rv-psg .psg { position: static; max-height: 360px; margin-top: 8px; }

/* constructed response materials: index tabs */
.qcol.wide { max-width: 1000px; }
.crq { font-family: var(--font-q); font-size: 18px; line-height: 1.55; margin: 0 0 18px; }
.crq p { margin: 0 0 10px; } .crq ul { margin: 0 0 10px; padding-left: 22px; } .crq li { margin: 0 0 6px; }
.cbox { border: 1px solid var(--line); background: var(--paper); margin-bottom: 18px; }
.ctabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); background: var(--surface); }
.ctabs .lbl { display: none; }
.ctab { border: 0; border-right: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; padding: 10px 14px; cursor: pointer; position: relative; }
.ctab:hover { color: var(--ink); }
.ctab[aria-selected="true"] { color: var(--ink); background: var(--paper); }
.ctab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--ember); }
.ctab.sg { font-style: italic; }
.cpanel { padding: 18px 22px; max-height: 440px; overflow: auto; font-size: 15px; line-height: 1.6; }
.cpanel h4 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 500; font-size: 19px; }
.cpanel table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; display: block; overflow-x: auto; max-width: 100%; }
.cpanel th, .cpanel td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.cpanel th { background: var(--sunk); }
.cpanel ul, .cpanel ol { padding-left: 22px; }
.cpanel .poem p { font-family: var(--font-q); font-size: 16.5px; }
.crlab { display: block; font-weight: 600; margin: 4px 0 6px; }
.crin { width: 100%; min-height: 280px; font: 16px/1.6 var(--font-q); padding: 14px 16px; border: 1px solid var(--rule); border-radius: 2px; background: var(--surface); resize: vertical; }
.crin:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.crfoot { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 12.5px; margin: 6px 0 0; font-family: var(--font-mono); }
.crans { border-left: 3px solid var(--rule); background: var(--paper); padding: 12px 16px; margin: 0 0 12px; }
.crans .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.crans .txt { white-space: pre-wrap; font-family: var(--font-q); font-size: 16px; line-height: 1.55; }
.selfscore { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13.5px; }
.selfscore > span { width: 100%; font-weight: 600; }

/* ───── Written Response Lab: a writing desk ───── */
.lab { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 0; border-top: 1px solid var(--ink); min-height: 70vh; }
.lab-lib { border-right: 1px solid var(--line); padding: 18px 18px 18px 0; min-width: 0; }
.lab-main { padding: 18px 26px 40px; min-width: 0; }
.lab-coach { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 92vw); z-index: 60; background: var(--surface); border-left: 1px solid var(--ink); box-shadow: -10px 0 0 color-mix(in srgb, var(--ink) 6%, transparent); padding: calc(18px + env(safe-area-inset-top, 0px)) 22px 30px; overflow-y: auto; font-size: 14px; transform: translateX(105%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; }
.lab-coach.open { transform: none; visibility: visible; transition: transform .22s ease; }
.coach-x { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; }
.coach-tab { position: fixed; right: 0; top: 50%; transform: translateY(-50%); z-index: 55; writing-mode: vertical-rl; border: 1px solid var(--ink); border-right: 0; background: var(--ink); color: var(--paper); padding: 14px 8px; font-weight: 600; font-size: 13px; letter-spacing: .04em; cursor: pointer; }
.coach-tab:hover { background: var(--cobalt); border-color: var(--cobalt); }
.coach-tab[aria-expanded="true"] { display: none; }
@media (prefers-reduced-motion: reduce) { .lab-coach, .lab-coach.open { transition: none; } }
.lab-lib h3, .lab-coach h3 { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0 0 8px; }
.lab-lib select { width: 100%; margin-bottom: 12px; }
.plist { list-style: none; margin: 0; padding: 0; max-height: 64vh; overflow: auto; }
.plist button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 9px 4px; cursor: pointer; font-size: 13.5px; line-height: 1.35; }
.plist button:hover { background: var(--sunk); }
.plist button[aria-current="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.plist button small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.plist .done { color: var(--good); font-family: var(--font-mono); font-size: 11px; }
.lab-coach details { border-top: 1px solid var(--line); padding: 8px 0; }
.lab-coach summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
.lab-coach ol, .lab-coach ul { padding-left: 18px; margin: 8px 0; }
.lab-coach li { margin-bottom: 6px; }
.frame-btn { display: block; width: 100%; text-align: left; border: 1px dashed var(--rule); background: transparent; padding: 7px 9px; margin: 0 0 6px; cursor: pointer; font-family: var(--font-q); font-size: 14.5px; line-height: 1.35; }
.frame-btn:hover { border-color: var(--ember); border-style: solid; }
.vocab dt { font-weight: 600; } .vocab dd { margin: 0 0 8px; color: var(--muted); }
.lab-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.report { margin-top: 26px; border-top: 2px solid var(--ink); padding-top: 18px; }
.report .est { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
.report .est .big { font-family: var(--font-display); font-size: 54px; line-height: 1; }
.report .est .big small { font-size: 22px; color: var(--muted); }
.report .disc { font-size: 12.5px; color: var(--muted); margin: 6px 0 16px; max-width: 70ch; }
.rubric { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 18px; }
.rubric th { text-align: left; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--ink); }
.rubric td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dots { display: inline-flex; gap: 3px; } .dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--accent); } .dots i.on { background: var(--accent); }
.checks { list-style: none; padding: 0; margin: 6px 0 16px; display: grid; gap: 6px; }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 14.5px; }
.checks li::before { font-family: var(--font-mono); font-weight: 700; }
.checks li.yes::before { content: "✓"; color: var(--good); } .checks li.no::before { content: "○"; color: var(--bad); }
.sugg { counter-reset: s; list-style: none; padding: 0; margin: 6px 0 16px; }
.sugg li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; padding: 6px 0; border-bottom: 1px dotted var(--rule); }
.sugg li::before { content: counter(s); font-family: var(--font-display); font-style: italic; color: var(--ember); font-size: 18px; line-height: 1.2; }
.ai-out { border-left: 3px solid var(--accent); padding: 12px 16px; background: var(--surface); white-space: pre-wrap; font-size: 14.5px; }
.thinking { font-family: var(--font-display); font-style: italic; color: var(--muted); }

/* ───── Quick Review: reference shelf ───── */
.qr { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 36px; border-top: 1px solid var(--ink); padding-top: 18px; }
.decklist { list-style: none; margin: 0; padding: 0; }
.decklist button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 9px 2px; cursor: pointer; font-size: 14.5px; font-weight: 600; }
.decklist button small { font-family: var(--font-mono); color: var(--muted); font-weight: 400; font-size: 12px; }
.decklist button:hover { color: var(--accent); }
.decklist button[aria-current="true"] { color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); padding-left: 10px; }
.qr-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.qr-tabs button { border: 0; background: transparent; padding: 10px 16px; font-weight: 600; color: var(--muted); cursor: pointer; position: relative; }
.qr-tabs button[aria-selected="true"] { color: var(--ink); }
.qr-tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; background: var(--ember); }
.card-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.fcard { perspective: 1400px; max-width: 680px; }
.fcard-in { position: relative; min-height: 260px; transition: transform .45s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; cursor: pointer; }
.fcard.flip .fcard-in { transform: rotateY(180deg); }
.fface { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--ink); box-shadow: 8px 8px 0 var(--sunk); padding: 26px 30px; display: flex; flex-direction: column; justify-content: center; gap: 10px; overflow: auto; }
.fface.back { transform: rotateY(180deg); background: var(--paper); }
.fface .kind { position: absolute; top: 12px; left: 16px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ember); }
.fface .topic { position: absolute; top: 12px; right: 16px; font-size: 12px; color: var(--muted); }
.fface .txt { font-family: var(--font-q); font-size: 23px; line-height: 1.35; }
.fface.back .txt { font-size: 18.5px; line-height: 1.5; }
.card-nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; max-width: 680px; }
.card-nav .count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin-right: auto; }
.pw-wrap { display: flex; align-items: center; gap: 8px; } .pw-wrap input { flex: 1; min-width: 0; }
.life-list { list-style: none; margin: 0; padding: 0; } .life-list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 8px 0; border-bottom: 1px solid var(--line); } .life-list .em { flex: 1; min-width: 180px; font-weight: 600; overflow-wrap: anywhere; }
.life-box { border-left: 4px solid var(--cobalt); }
.fc-done { text-align: center; padding: 28px 16px; } .fc-done p { margin: 0 0 8px; }
.sheet-tools { display: flex; align-items: center; gap: 14px; margin: 0 0 8px; } .sheet-tools span { flex: 1; }
.sheets { border-top: 1px solid var(--ink); }
.sheet { border-bottom: 1px solid var(--line); }
.sheet > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 12px; padding: 14px 4px; }
.sheet > summary::-webkit-details-marker { display: none; }
.sheet > summary .sh-t { font-family: var(--font-display); font-weight: 500; font-size: 20px; }
.sheet > summary small { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet > summary::after { content: "+"; margin-left: auto; font-family: var(--font-mono); font-size: 18px; color: var(--muted); }
.sheet[open] > summary::after { content: "–"; color: var(--accent); }
.sheet > summary:hover .sh-t { color: var(--accent); }
.sheet[open] > summary { border-bottom: 2px solid var(--accent); }
.sh-body { padding: 12px 4px 22px; max-width: 860px; }
.sheet .sn { font-size: 14px; color: var(--muted); margin: 0 0 12px; font-style: italic; font-family: var(--font-display); }
.sheet table { width: 100%; border-collapse: collapse; font-size: 14px; }
.sheet th { text-align: left; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; padding: 5px 6px; border-bottom: 1px solid var(--ink); }
.sheet td { padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.sheet th { padding: 6px 8px; } .sheet tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--sunk) 45%, transparent); }
.sheet td:first-child { font-weight: 600; }

/* about */
.about-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 44px; }
.about-grid h3 { font-family: var(--font-display); font-weight: 500; font-size: 24px; margin: 0 0 8px; }
.legal { font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

@media (max-width: 1180px) {
  .nav-in { flex-wrap: wrap; gap: 0 12px; min-height: 0; }
  .brand { min-height: 54px; }
  .nav-in .spacer { display: none; }
  .nav-side { margin-left: auto; min-height: 54px; }
  .tabs-nav { order: 3; width: 100%; margin-inline: -9px; border-top: 1px solid var(--line); }
  .tabs-nav a { min-height: 44px; }
}
@media (max-width: 1020px) {
  .lab { grid-template-columns: minmax(0, 1fr); }
  .lab-lib { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px 0; }
  .plist { max-height: 240px; }
  .lab-main { padding: 18px 0 30px; }
  .coach-tab { top: auto; bottom: 90px; transform: none; padding: 12px 7px; }
}
@media (max-width: 980px) { .psplit { grid-template-columns: minmax(0, 1fr); gap: 16px; } .psg { position: static; max-height: 46vh; } }
@media (max-width: 860px) {
  .hero2, .mode-head, .t-head, .grid2, .stats3, .about-grid, .foot { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .sec { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .modes { grid-template-columns: minmax(0, 1fr); }
  .mode, .mode + .mode { padding: 22px 0; border-left: 0; }
  .mode + .mode { border-top: 1px solid var(--line); }
  .cycle { grid-template-columns: minmax(0, 1fr); }
  .cycle > div, .cycle > div + div { padding: 14px 0; border-right: 0; border-bottom: 1px solid var(--line); }
  .qr { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .decklist { display: flex; flex-wrap: wrap; gap: 6px; }
  .decklist li { flex: none; }
  .decklist button { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .decklist button small { display: none; }
  .decklist button[aria-current="true"] { box-shadow: none; padding-left: 12px; background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .score { grid-template-columns: minmax(0, 1fr); }
  .give { grid-template-columns: minmax(0, 1fr); }
  .foot nav { justify-content: flex-start; }
}
@media (max-width: 640px) {
  .page { padding-inline: 16px; padding-block: 26px 48px; }
  .nav-in { padding-inline: 16px; flex-wrap: wrap; gap: 0 12px; min-height: 0; }
  .brand { min-height: 50px; font-size: 21px; }
  .nav-in .spacer { display: none; }
  .nav-side { margin-left: auto; min-height: 50px; }
  .tabs-nav { order: 3; width: 100%; margin-inline: -4px; border-top: 1px solid var(--line); }
  .tabs-nav a { min-height: 42px; padding: 0 9px; font-size: 13px; }
  .tabs-nav a[aria-current="page"]::after { left: 9px; right: 9px; }
  .nav-fb { display: none; }
  .who-name { display: none; } .who { padding: 3px; }
  .xtop, .xtools, .xbody { padding-inline: 16px; }
  .stem { font-size: 18px; } .choice { font-size: 16.5px; }
  .catrow { grid-template-columns: 34px minmax(0, 1fr) 54px; } .catrow .raw { display: none; }
  .timer .lbl { display: none; }
  .specs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tlist li { grid-template-columns: 52px minmax(0, 1fr); }
  .tlist li .btn { grid-column: 2; justify-self: start; }
  .fface .txt { font-size: 20px; } .fface { padding: 34px 20px 20px; }
  .give { padding: 22px 18px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* AP Practice Hub: a calm study dashboard. Navy sidebar, white cards on a cool gray-blue page,
   one color per subject (Biology green, Chemistry indigo, Physics orange), navy for primary actions. */
:root {
  --paper: #f3f6fb; --surface: #ffffff; --sunk: #edf1f7; --line: #e2e8f1; --rule: #cdd6e3; --ink: #14213d; --muted: #5d6a84;
  --navy: #13284a; --navy-2: #1b3560; --navy-ink: #e9eef8; --navy-muted: #9fb0cc;
  --cobalt: #1f3b6e; --cobalt-soft: #e5ecf8; --ember: #2f5bd3; --ember-soft: #e8eefc;
  --bio: #2a9a55; --bio-soft: #e3f4e9; --chem: #5850d6; --chem-soft: #ebeafc; --phys: #ee7a1e; --phys-soft: #fdeedf;
  --accent: var(--cobalt); --accent-soft: var(--cobalt-soft); --accent-ink: #ffffff;
  --btn: #172d52; --btn-ink: #ffffff;
  --mark: #a86a0c; --mark-soft: #fbf0db; --good: #1f8a4c; --good-soft: #def3e6; --bad: #c2412d; --bad-soft: #fbe5e0;
  --scrim: rgba(13, 24, 44, .5); --shadow: 0 1px 2px rgba(20, 33, 61, .05), 0 4px 16px rgba(20, 33, 61, .05);
  --font-display: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-ui: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-serif: "Source Serif 4", Georgia, serif;
  --font-q: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --wrap: 1240px; --side-w: 272px; --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1524; --surface: #162034; --sunk: #1d2940; --line: #26344f; --rule: #34446a; --ink: #e7ecf6; --muted: #9aa8c2;
    --navy: #0b1424; --navy-2: #16243d; --navy-ink: #e7ecf6; --navy-muted: #8b9bb8;
    --cobalt: #9db6f2; --cobalt-soft: #1f2d4b; --ember: #8eaaf7; --ember-soft: #1d2a48;
    --bio: #5cc785; --bio-soft: #16301f; --chem: #9d97f2; --chem-soft: #24224a; --phys: #f6a25e; --phys-soft: #3a2614;
    --accent-ink: #0e1524; --btn: #9db6f2; --btn-ink: #0e1524;
    --mark: #e8b45a; --mark-soft: #3a2d14; --good: #6fd197; --good-soft: #16301f; --bad: #f28c78; --bad-soft: #3d1f19;
    --scrim: rgba(0, 0, 0, .6); --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1524; --surface: #162034; --sunk: #1d2940; --line: #26344f; --rule: #34446a; --ink: #e7ecf6; --muted: #9aa8c2;
  --navy: #0b1424; --navy-2: #16243d; --navy-ink: #e7ecf6; --navy-muted: #8b9bb8;
  --cobalt: #9db6f2; --cobalt-soft: #1f2d4b; --ember: #8eaaf7; --ember-soft: #1d2a48;
  --bio: #5cc785; --bio-soft: #16301f; --chem: #9d97f2; --chem-soft: #24224a; --phys: #f6a25e; --phys-soft: #3a2614;
  --accent-ink: #0e1524; --btn: #9db6f2; --btn-ink: #0e1524;
  --mark: #e8b45a; --mark-soft: #3a2d14; --good: #6fd197; --good-soft: #16301f; --bad: #f28c78; --bad-soft: #3d1f19;
  --scrim: rgba(0, 0, 0, .6); --shadow: none; color-scheme: dark;
}
#app.acc-chem, .acc-chem { --accent: var(--chem); --accent-soft: var(--chem-soft); }
#app.acc-bio, .acc-bio { --accent: var(--bio); --accent-soft: var(--bio-soft); }
#app.acc-phys, .acc-phys { --accent: var(--phys); --accent-soft: var(--phys-soft); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; margin: 0; }
#app { min-height: 100%; }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
sub, sup { font-size: 0.72em; line-height: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
h1, h2, h3 { text-wrap: balance; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, color .15s, border-color .15s, box-shadow .15s; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn.primary:hover { filter: brightness(1.15); }
.btn.big { min-height: 48px; padding: 0 22px; font-size: 15px; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.quiet { border-color: var(--line); background: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn .ico { width: 16px; height: 16px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ember); font-weight: 600; cursor: pointer; text-decoration: none; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn.sm { font-size: 13px; }
select, input, textarea { font: inherit; color: var(--ink); }
select, input[type="number"], input[type="email"], input:not([type]) { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); max-width: 100%; }

/* ───── shell: sidebar + top bar ───── */
#hub, #results { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); grid-auto-rows: auto; align-items: start; min-height: 100vh; }
#hub > *:not(.side), #results > *:not(.side) { grid-column: 2; }
#hub > .page.gate, #hub > .page:only-child { grid-column: 1 / -1; }
.side { grid-column: 1; grid-row: 1 / span 40; position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--navy); color: var(--navy-ink); padding: 18px 14px 22px; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; }
.side-brand { display: flex; align-items: center; gap: 12px; padding: 6px 8px 18px; margin-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, .1); color: #fff; text-decoration: none; }
.side-brand .sb-ic .ico { width: 38px; height: 38px; stroke-width: 1.5; }
.side-brand b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
.side-brand small { display: block; font-size: 12px; color: var(--navy-muted); letter-spacing: .02em; margin-top: 2px; }
.side-nav { display: grid; gap: 2px; }
.side-nav a { display: flex; align-items: center; gap: 13px; padding: 10px 12px; border-radius: 8px; color: var(--navy-ink); text-decoration: none; font-weight: 500; font-size: 14.5px; }
.side-nav a:hover { background: rgba(255, 255, 255, .07); }
.side-nav a[aria-current="page"] { background: var(--navy-2); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); font-weight: 600; }
.side-nav a .ico { width: 20px; height: 20px; opacity: .92; }
.side-nav.subjnav .s-ic { width: 26px; height: 26px; display: grid; place-items: center; color: var(--accent); }
.side-nav.subjnav .s-ic .ico { width: 22px; height: 22px; }
.side-nav.subjnav a { --chem: #8f88ff; --bio: #4fd07f; --phys: #ff9a45; }
.side-h { margin: 18px 12px 6px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, .1); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--navy-muted); }
.side-quote { margin: auto 10px 0; padding-top: 28px; font-family: var(--font-serif); font-style: italic; font-size: 15px; line-height: 1.45; color: var(--navy-muted); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; min-height: 68px; padding: 10px 28px; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .spacer { flex: 1; }
.tb-brand { display: none; font-weight: 700; color: var(--ink); text-decoration: none; font-size: 17px; }
.tb-icon { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 50%; cursor: pointer; color: var(--ink); }
.tb-icon:hover { background: var(--sunk); }
.tb-icon .ico { width: 22px; height: 22px; }
.tb-icon .dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--phys); box-shadow: 0 0 0 2px var(--paper); }
.menu-btn { display: none; }
.bell-wrap { position: relative; }
.pop { position: absolute; right: 0; top: 48px; width: 320px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 12px 32px rgba(20, 33, 61, .16); padding: 8px; z-index: 6; }
.pop-h { font-weight: 700; padding: 8px 10px; }
.pop-i { display: flex; gap: 12px; padding: 10px; border-radius: 8px; color: var(--ink); text-decoration: none; }
a.pop-i:hover { background: var(--sunk); }
.pop-i b { display: block; font-size: 14px; } .pop-i small { color: var(--muted); font-size: 12.5px; }
.pop-e { color: var(--muted); font-size: 14px; margin: 4px 10px 10px; }
.who { display: inline-flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 4px 6px 4px 4px; border-radius: 999px; cursor: pointer; text-align: left; }
.who:hover { background: var(--sunk); }
.who .av, .pcard .av { width: 40px; height: 40px; border-radius: 50%; background: var(--navy-2); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; letter-spacing: .02em; flex: none; }
.who-t b { display: block; font-size: 14.5px; line-height: 1.2; } .who-t small { color: var(--muted); font-size: 12.5px; }
.who .ico { width: 16px; height: 16px; color: var(--muted); }
.live-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; text-decoration: none; white-space: nowrap; background: var(--surface); }
.live-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.live-pill.zero i { background: var(--muted); box-shadow: none; }
.memnote { background: var(--mark-soft); color: var(--ink); border-bottom: 1px solid var(--line); padding: 8px 24px; font-size: 13px; text-align: center; }

/* ───── page grammar ───── */
.page { width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 28px 28px 56px; }
.card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; min-width: 0; box-shadow: var(--shadow); }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.crumb a { color: var(--muted); }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
.phead h1, .welcome h1, .t-head h1 { font-size: clamp(26px, 3vw, 34px); font-weight: 800; letter-spacing: -.02em; line-height: 1.15; margin: 4px 0 6px; display: flex; align-items: center; gap: 12px; }
p.serif, .serif { font-family: var(--font-serif); font-size: 18px; color: var(--muted); margin: 0; max-width: 70ch; }
h1.display { font-size: clamp(28px, 3.4vw, 38px); font-weight: 800; letter-spacing: -.02em; line-height: 1.12; margin: 6px 0 10px; }
p.lead { color: var(--muted); max-width: 62ch; margin: 0 0 22px; font-size: 17px; font-family: var(--font-serif); }
h2.title { font-size: 24px; font-weight: 800; margin: 0 0 8px; letter-spacing: -.01em; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.panel h2, h2.sec-h, h3.ch, h2.ch { font-size: 15px; font-weight: 700; color: var(--ink); margin: 0 0 12px; letter-spacing: 0; text-transform: none; font-family: var(--font-ui); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.empty { padding: 18px; border: 1px dashed var(--rule); border-radius: 10px; color: var(--muted); font-size: 14px; }
.card.empty { border-style: dashed; box-shadow: none; }
.notice { border-left: 3px solid var(--ember); background: var(--ember-soft); padding: 10px 14px; font-size: 14px; border-radius: 0 8px 8px 0; }
.foot { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px 40px; }
.foot p { margin: 0 0 6px; max-width: 70ch; }
.foot nav { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: flex-end; align-content: start; }
.foot nav a { color: var(--ink); font-weight: 600; text-decoration: none; }
.copyline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.copyline input { flex: 1 1 260px; font-family: var(--font-mono); font-size: 12.5px; }
.linkline, .addr { font-family: var(--font-mono); font-size: 13.5px; overflow-wrap: anywhere; user-select: all; background: var(--sunk); padding: 6px 9px; border-radius: 6px; }
.copied { color: var(--good); font-size: 12.5px; font-weight: 600; }

/* subject icon chips */
.sico { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-grid; place-items: center; flex: none; }
.sico .ico { width: 22px; height: 22px; stroke-width: 1.9; }
.sico.lg { width: 56px; height: 56px; } .sico.lg .ico { width: 30px; height: 30px; }
.sico.sm { width: 32px; height: 32px; border-radius: 9px; } .sico.sm .ico { width: 18px; height: 18px; }
.phead h1 .sico.lg { width: 48px; height: 48px; }
.meta { list-style: none; margin: 14px 0 16px; padding: 0; display: grid; gap: 8px; font-size: 13.5px; color: var(--muted); }
.meta li { display: flex; gap: 10px; align-items: center; }
.meta .ico { width: 17px; height: 17px; color: var(--ink); opacity: .8; }
.lbar { display: block; height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.lbar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* ───── dashboard ───── */
.page.dash { max-width: 1480px; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; align-items: start; }
.dash-main { min-width: 0; display: grid; gap: 22px; }
.dash-rail { display: grid; gap: 18px; position: sticky; top: 88px; }
.welcome { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
.welcome h1 { font-size: clamp(28px, 3.2vw, 38px); }
.goal { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: var(--radius); background: var(--cobalt-soft); color: var(--ink); text-decoration: none; min-width: 300px; max-width: 380px; border: 1px solid color-mix(in srgb, var(--ember) 18%, transparent); }
.goal:hover { border-color: var(--ember); }
.goal .gi { width: 42px; height: 42px; color: var(--ember); stroke-width: 1.6; }
.goal b { display: block; color: var(--ember); font-size: 15px; } .goal span span { font-size: 14px; }
.goal .gc { width: 18px; height: 18px; margin-left: auto; color: var(--muted); }
.subjs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.subj-card { position: relative; background: linear-gradient(160deg, var(--accent-soft), var(--surface) 55%); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.sc-h { display: flex; align-items: center; gap: 14px; }
.sc-h h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.subj-card > p { margin: 16px 0 0; color: var(--muted); font-family: var(--font-serif); font-size: 16px; line-height: 1.45; min-height: 3em; }
.subj-card .meta { margin-top: auto; padding-top: 16px; }
.card-h { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.card-h h2 { font-size: 20px; font-weight: 800; margin: 0 0 2px; }
.card-h h3 { font-size: 16px; font-weight: 700; margin: 0; }
.card-h p { margin: 0; color: var(--muted); font-size: 14px; }
.card-h.sm { align-items: center; gap: 10px; flex-wrap: wrap; }
.card-h .hi { width: 24px; height: 24px; color: var(--ink); }
.card-h .more, a.more { margin-left: auto; font-size: 13.5px; font-weight: 600; color: var(--ember); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.more .ico { width: 15px; height: 15px; }
.seg-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 16px; }
.seg-tabs button { border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; padding: 9px 18px; font-weight: 600; font-size: 13.5px; cursor: pointer; }
.seg-tabs button[aria-selected="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.minis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.mini { border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; background: var(--surface); }
.mini-h { display: flex; gap: 12px; align-items: center; }
.mini-h b { display: block; font-size: 15.5px; }
.mini-h small { color: var(--muted); font-size: 13px; }
.mini-h select { margin-top: 4px; padding: 5px 8px; font-size: 13px; }
.mini-unit { margin-top: 12px; width: 100%; font-size: 13.5px; }
.mini .meta { margin: 14px 0; }
.mini .btn { margin-top: auto; }
.lvl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 16px; }
.lvl-row #lvlNote { flex: 1 1 320px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
.seg input:checked + span { background: var(--btn); color: var(--btn-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--ember); outline-offset: -2px; }
.dash-row { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.keys { display: flex; gap: 12px; list-style: none; margin: 0 0 0 auto; padding: 0; font-size: 12px; color: var(--muted); }
.keys li { display: flex; align-items: center; gap: 5px; } .keys i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
svg.perf { width: 100%; height: auto; display: block; }
svg.perf .gl { stroke: var(--line); stroke-width: 1; }
svg.perf .axt { font-size: 10.5px; fill: var(--muted); font-family: var(--font-ui); }
.chart-empty { display: grid; place-items: center; text-align: center; gap: 8px; min-height: 170px; color: var(--muted); font-size: 13.5px; padding: 10px; }
.chart-empty .ico { width: 30px; height: 30px; opacity: .55; }
.chart-empty p { margin: 0; max-width: 28ch; }
.donut { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.donut .dn-v { font-size: 22px; font-weight: 800; fill: var(--ink); } .donut .dn-l { font-size: 9px; fill: var(--muted); }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; flex: 1 1 140px; font-size: 13.5px; }
.legend li { display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 8px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.legend small { grid-column: 2 / -1; color: var(--muted); font-size: 12px; margin-top: -6px; }
.improve { list-style: none; margin: 0; padding: 0; display: grid; }
.improve li { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }

    { pts: 1, t: '(d) Data plotted accurately with error bars of ±2 SE.', kw: ['error bar|±|2 ?se'] },
    { pts: 1, t: '(e) Yes, significantly different: the ±2 SE ranges (10.5–12.5 mL and 6.4–8.0 mL) do not overlap.', kw: ['overlap', 'significant|different'] },
    { pts: 1, t: '(f) Low pH (excess H⁺) disrupts the hydrogen and ionic bonds that maintain the enzyme’s shape, so the active site changes (denaturation) and binds substrate poorly.', kw: ['denatur|shape|bond|ionic|hydrogen|charge', 'active site|substrate|fold|structure'] },
    { pts: 1, t: '(g) Much less O₂ (near 0 mL): high temperature denatures catalase.', kw: ['less|lower|decrease|little|near 0|zero|no o2', 'denatur|shape|unfold'] },
  ],
  `(a) An enzyme's active site has a specific three-dimensional shape and arrangement of charged and polar groups that matches its substrate. Only the substrate fits, and binding positions it so the reaction's activation energy is lowered.
(b) Independent variable: pH of the solution. Dependent variable: volume of O2 produced in 2 minutes.
(c) Temperature should be held constant at 25 °C, because temperature changes the rate of enzyme-catalyzed reactions and would confound the effect of pH.
(d) Bar graph (or line graph): x-axis "pH" with values 3, 5, 7, 9, 11; y-axis "Mean volume of O2 produced (mL)" from 0 to 14 mL. Bars at 2.1, 6.8, 11.5, 7.2, and 1.4 mL, each with an error bar extending ±2 SE (0.6, 0.9, 1.0, 0.8, 0.5).
(e) Yes. At pH 7 the range is 10.5–12.5 mL, and at pH 9 it is 6.4–8.0 mL. The error bars do not overlap, so the difference is statistically significant.
(f) At pH 3 the high concentration of H+ alters the charges on amino acid R groups and disrupts the hydrogen and ionic bonds that hold catalase's tertiary structure. The active site changes shape (the enzyme denatures), so it binds H2O2 poorly and the rate falls.
(g) Much less O2, close to 0 mL. At 80 °C, catalase would denature because heat breaks the weak bonds that maintain its shape, so it could no longer catalyze the reaction.`);

P('bio-l-transpiration', 'bio-long', 9, ['2', '8'], 'Wind and transpiration',
  `A student measured water loss from bean plants using a potometer. Five plants were tested in still air and five in moving air from a fan. Water loss was measured every 10 minutes.\n\n` + T([['Time (min)', '0', '10', '20', '30'], ['Still air: mean water loss (mL)', '0', '0.20', '0.41', '0.60'], ['Moving air: mean water loss (mL)', '0', '0.45', '0.88', '1.35']]),
  `(a) Describe the role of stomata in gas exchange and water loss.
(b) Identify the control group in this experiment.
(c) State the null hypothesis for this experiment.
(d) Construct a graph of the data showing both conditions. (Describe the graph if you cannot draw it: type, axes, labels, units, and key.)
(e) Calculate the rate of water loss, in mL/min, for plants in moving air from 0 to 30 minutes.
(f) Explain how moving air increases the rate of transpiration.
(g) Predict how closing the stomata would affect the rate of photosynthesis, and justify your prediction.`,
  [
    { pts: 1, t: '(a) Stomata let CO₂ enter the leaf for photosynthesis and O₂ out, and water vapor exits through them (transpiration).', kw: ['co2|carbon dioxide|gas', 'water|transpir'] },
    { pts: 1, t: '(b) Control group: plants in still air.', kw: ['still air|no fan|without (the )?fan'] },
    { pts: 1, t: '(c) Null hypothesis: moving air has no effect on the rate of water loss (no difference between still and moving air).', kw: ['no (effect|difference)|not affect|same|does not'] },
    { pts: 1, t: '(d) Line graph with time (min) on the x-axis and water loss (mL) on the y-axis, both labeled with units.', kw: ['line', 'time|min', 'ml|water loss'] },
    { pts: 1, t: '(d) Both conditions plotted accurately and distinguished with a key or labels.', kw: ['key|legend|two lines|both|label'] },
    { pts: 1, t: '(e) 1.35 mL / 30 min = 0.045 mL/min.', num: [0.045, 0.03] },
    { pts: 1, t: '(f) Moving air carries away humid air near the leaf, keeping the water-vapor concentration outside the stomata low and the diffusion gradient steep.', kw: ['humid|water vapor|moisture|concentration|gradient', 'away|remov|steeper|diffus'] },
    { pts: 1, t: '(g) Photosynthesis would decrease.', kw: ['decrease|slow|less|lower|reduce'] },
    { pts: 1, t: '(g) Closed stomata limit CO₂ entering the leaf, so less CO₂ is available for the Calvin cycle.', kw: ['co2|carbon dioxide', 'calvin|fix|less|limit|enter'] },
  ],
  `(a) Stomata are pores, controlled by guard cells, that let CO2 diffuse into the leaf for photosynthesis and O2 out. Water vapor also diffuses out through open stomata, which is transpiration.
(b) The plants in still air are the control group.
(c) Null hypothesis: there is no difference in the rate of water loss between plants in moving air and plants in still air.
(d) Line graph: x-axis "Time (min)" from 0 to 30; y-axis "Mean water loss (mL)" from 0 to 1.5. Two lines, one for still air (0, 0.20, 0.41, 0.60) and one for moving air (0, 0.45, 0.88, 1.35), identified with a key.
(e) Rate = 1.35 mL ÷ 30 min = 0.045 mL/min.
(f) Water vapor leaving the stomata builds up in a thin humid layer around the leaf. Moving air sweeps that humid air away, so the concentration of water vapor outside stays low. The steeper concentration gradient makes water diffuse out of the leaf faster.
(g) The rate of photosynthesis would decrease. With the stomata closed, CO2 cannot diffuse into the leaf, so the Calvin cycle has less CO2 to fix into sugar.`);

P('bio-l-insulin', 'bio-long', 9, ['4'], 'Blood glucose and insulin signaling',
  `Researchers measured blood glucose in two groups of mice after each group ate the same meal at time 0. Group 1 had normal insulin receptors. Group 2 had a mutation that prevents the insulin receptor from phosphorylating itself.\n\n` + T([['Time after meal (min)', '0', '30', '60', '90', '120'], ['Group 1 glucose (mg/dL)', '90', '160', '120', '100', '92'], ['Group 2 glucose (mg/dL)', '95', '170', '175', '172', '168']]),
  `(a) Describe how insulin's binding to its receptor leads to a response in a target cell.
(b) Identify the independent variable in this experiment.
(c) Explain why both groups ate the same meal.
(d) Using the data, describe the difference between the two groups after 60 minutes.
(e) Explain how the mutation in Group 2 leads to the results observed.
(f) Blood glucose regulation is an example of negative feedback. Explain how the data from Group 1 show negative feedback.
(g) Predict the effect of injecting extra insulin into Group 2 mice, and justify your prediction.`,
  [
    { pts: 1, t: '(a) Insulin binds a receptor tyrosine kinase; receptor subunits phosphorylate each other and activate relay proteins (a phosphorylation cascade).', kw: ['receptor', 'phosphorylat|kinase|cascade|relay'] },
    { pts: 1, t: '(a) The pathway leads to a response such as inserting glucose transporters into the membrane, increasing glucose uptake.', kw: ['glucose', 'transport|uptake|channel|glut|absorb'] },
    { pts: 1, t: '(b) Independent variable: whether the insulin receptor is normal or mutated.', kw: ['receptor|mutation|mutant|normal|group'] },
    { pts: 1, t: '(c) To control the amount of glucose consumed, so differences are due to the receptor and not the food.', kw: ['control|same amount|constant|only variable|confound'] },
    { pts: 1, t: '(d) After 60 min, Group 1 glucose falls back toward 90 mg/dL, while Group 2 stays high (about 170 mg/dL).', kw: ['group 1|normal', 'group 2|mutant|high|stays|remain'] },
    { pts: 1, t: '(e) Without autophosphorylation, the receptor can’t activate the relay proteins, so the signal is not transduced.', kw: ['phosphorylat|activat|signal|transduc|relay'] },
    { pts: 1, t: '(e) Cells do not take up glucose, so blood glucose stays high.', kw: ['glucose', 'not (taken|absorb|enter)|stays high|remain|cannot|can.?t|no uptake'] },
    { pts: 1, t: '(f) The rise in glucose triggers insulin release, which lowers glucose back toward the set point (~90 mg/dL); the response reduces the original change.', kw: ['return|back|set point|normal|baseline|reduc|counter|opposite'] },
    { pts: 1, t: '(g) Little or no change in Group 2 glucose, because the receptors still cannot be activated (the defect is in the receptor, not insulin levels).', kw: ['no (change|effect)|little|stay|remain|still high', 'receptor|cannot|can.?t|not respond'] },
  ],
  `(a) Insulin binds its receptor, a receptor tyrosine kinase, on the target cell's surface. The receptor subunits phosphorylate each other, and the phosphorylated receptor activates relay proteins in a cascade. The response includes moving glucose transporter proteins to the plasma membrane, so the cell takes in more glucose.
(b) The independent variable is the type of insulin receptor (normal or mutated).
(c) Eating the same meal controls the amount of glucose each mouse took in, so any difference in blood glucose is due to the receptor, not the food.
(d) After 60 minutes, Group 1 glucose falls from 160 to about 90–100 mg/dL, while Group 2 glucose stays high at about 170 mg/dL through 120 minutes.
(e) Without autophosphorylation, the receptor cannot activate the relay proteins, so the insulin signal is never passed into the cell. Target cells do not add glucose transporters, so glucose is not taken up and stays in the blood.
(f) In Group 1, the meal raises blood glucose, which triggers insulin release. Insulin causes cells to take up glucose, lowering blood glucose back toward the set point of about 90 mg/dL. The response counteracts the original change, which is negative feedback.
(g) Blood glucose in Group 2 would stay high. Their problem is not a lack of insulin but receptors that cannot transmit the signal, so extra insulin still cannot activate the pathway.`);

P('bio-l-antibiotic', 'bio-long', 9, ['7'], 'Antibiotic resistance in a bacterial population',
  `A population of bacteria was grown for 10 days. Starting on day 3, a low dose of an antibiotic was added to the culture each day. Each day, researchers measured the percentage of the population carrying a resistance allele, R.\n\n` + T([['Day', '0', '2', '4', '6', '8', '10'], ['Bacteria with allele R (%)', '2', '2', '9', '35', '71', '93']]),
  `(a) Explain why a small percentage of bacteria carried allele R before the antibiotic was added.
(b) Identify the selective pressure in this experiment.
(c) Construct a graph of the data. (Describe it if you cannot draw it: type, axes, labels, and units.)
(d) Describe the trend in the frequency of allele R after day 3.
(e) Explain the change in allele R frequency using the concept of natural selection.
(f) Is this population in Hardy–Weinberg equilibrium? Justify your answer.
(g) Bacteria can also gain resistance genes from other bacteria. Identify ONE mechanism by which this can happen.`,
  [
    { pts: 1, t: '(a) Allele R arose by random mutation (or entered by gene transfer) before exposure; mutations are not caused by the antibiotic.', kw: ['mutation|random|already|variation|preexist'] },
    { pts: 1, t: '(b) The antibiotic.', kw: ['antibiotic'] },
    { pts: 1, t: '(c) Line graph with day on the x-axis and percent with allele R on the y-axis, labeled.', kw: ['line|graph|plot', 'day', '%|percent|frequency'] },
    { pts: 1, t: '(c) Points plotted accurately.', kw: ['2|9|35|71|93'] },
    { pts: 1, t: '(d) The frequency of R increases rapidly after day 3, from 2% to 93% by day 10.', kw: ['increas|rose|rises|grew'] },
    { pts: 1, t: '(e) Bacteria with R survive and reproduce in the presence of the antibiotic, while susceptible bacteria die.', kw: ['surviv|live', 'reproduc|offspring|divid'] },
    { pts: 1, t: '(e) Resistant bacteria pass R to their offspring, so R becomes more common in each generation.', kw: ['pass|inherit|offspring|next generation|daughter'] },
    { pts: 1, t: '(f) No: allele frequencies are changing because of natural selection, which violates Hardy–Weinberg conditions.', kw: ['\\bno\\b|not', 'selection|chang'] },
    { pts: 1, t: '(g) Horizontal gene transfer: conjugation (plasmid transfer), transformation, or transduction.', kw: ['conjugation|transformation|transduction|plasmid|horizontal'] },
  ],
  `(a) Allele R arose by random mutation in a few bacteria before the antibiotic was ever added. Mutations occur by chance and are not caused by the need for resistance.
(b) The antibiotic is the selective pressure.
(c) Line graph: x-axis "Day" (0–10); y-axis "Bacteria with allele R (%)" (0–100). Points at (0, 2), (2, 2), (4, 9), (6, 35), (8, 71), (10, 93) connected by lines.
(d) Before day 3 the frequency stays at 2%. After the antibiotic is added, it rises quickly, reaching 93% by day 10.
(e) The antibiotic kills most bacteria without R, while bacteria with R survive and reproduce. Their offspring inherit R, so each generation contains a larger proportion of resistant bacteria and the frequency of R increases.
(f) No. The allele frequency changes over time because of natural selection, so the population is evolving and not in Hardy–Weinberg equilibrium.
(g) Conjugation, in which a plasmid carrying the resistance gene passes from one bacterium to another.`);

P('bio-s-investigation', 'bio-short', 4, ['8'], 'Fertilizer and algae growth', `A student wants to test whether adding phosphate fertilizer increases the growth of algae in pond water. She has 10 identical jars of pond water, phosphate solution, a light source, and a way to measure algae density (cells per mL).`,

    { pts: 1, t: '(b) Algae density (cells per mL).', kw: ['density|cells per ml|algae (growth|amount|number)'] },
