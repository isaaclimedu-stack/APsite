P('bio-s-concept-hb', 'bio-short', 4, ['1'], 'Sickle-cell hemoglobin', `In sickle-cell disease, a single base substitution in the gene for β-globin changes the amino acid glutamic acid (charged) to valine (nonpolar) at one position on the surface of hemoglobin. At low oxygen, these hemoglobin molecules stick together into long fibers.`,
  `(a) Identify the level of protein structure that is directly changed by the mutation.
(b) Explain how replacing a charged amino acid with a nonpolar one can make hemoglobin molecules stick together.
(c) Describe how this change in protein shape affects the function of red blood cells.
(d) In regions where malaria is common, the sickle-cell allele remains at a relatively high frequency. Explain why.`,
  [
    { pts: 1, t: '(a) Primary structure (the amino acid sequence).', kw: ['primary'] },
    { pts: 1, t: '(b) The nonpolar valine on the surface interacts hydrophobically with nonpolar regions of other hemoglobin molecules.', kw: ['hydrophobic|nonpolar', 'other|interact|attract|bind|stick'] },
    { pts: 1, t: '(c) Fibers distort red blood cells into a sickle shape, so they carry less oxygen and can block small blood vessels.', kw: ['sickle|shape|deform', 'oxygen|block|clog|vessel|flow'] },
    { pts: 1, t: '(d) Heterozygotes are resistant to malaria (heterozygote advantage), so selection maintains the allele.', kw: ['heterozygo|carrier|one copy', 'malaria|resist|advantage|survive'] },
  ],
  `(a) Primary structure: one amino acid in the sequence is changed.
(b) Valine is nonpolar. On the outside of hemoglobin, it is surrounded by water, so it forms hydrophobic interactions with nonpolar patches on neighboring hemoglobin molecules, linking them into fibers.
(c) The fibers deform red blood cells into a rigid sickle shape. Sickled cells carry less oxygen, break down sooner, and can block small blood vessels, reducing blood flow.
(d) People with one copy of the sickle-cell allele are more resistant to malaria (heterozygote advantage), so they survive and reproduce more often in malaria regions, and selection keeps the allele common.`, 'Conceptual analysis');

P('bio-s-model-membrane', 'bio-short', 4, ['2'], 'A model of membrane transport', `A model of a cell membrane shows three proteins. Protein X is a channel that lets {K^+} ions pass down their concentration gradient. Protein Y uses ATP to move {Na^+} out of the cell and {K^+} into the cell. Protein Z carries glucose into the cell along with {Na^+}, using the {Na^+} gradient.`,
  `(a) Identify the type of transport performed by protein X.
(b) Explain why protein Y requires ATP.
(c) Explain how protein Z can move glucose into the cell without using ATP directly.
(d) Predict the effect on glucose uptake if protein Y is blocked by a drug. Justify your prediction.`,
  [
    { pts: 1, t: '(a) Facilitated diffusion (passive transport).', kw: ['facilitated|passive'] },
    { pts: 1, t: '(b) Protein Y moves ions against their concentration gradients (active transport), which requires energy.', kw: ['against|up (the|their)|low.{0,20}high|active'] },
    { pts: 1, t: '(c) Na⁺ flows down its gradient through Z, and that energy drives glucose in against its gradient (cotransport / secondary active transport).', kw: ['na|sodium', 'gradient|cotransport|symport|secondary'] },
    { pts: 1, t: '(d) Glucose uptake decreases, because without Y the Na⁺ gradient runs down and can no longer power Z.', kw: ['decrease|less|stop|slow|reduce', 'gradient|na|sodium'] },
  ],
  `(a) Facilitated diffusion: K+ moves down its gradient through the channel without energy input.
(b) Protein Y moves Na+ and K+ against their concentration gradients, which is active transport and requires the energy released by ATP hydrolysis.
(c) Protein Z is a cotransporter. Na+ flows into the cell down the gradient made by protein Y, and the energy of that flow carries glucose in with it, even against glucose's own gradient.
(d) Glucose uptake would decrease. Without protein Y, the Na+ gradient would gradually disappear, and protein Z would have no gradient to power glucose transport.`, 'Analysis of a model');

P('bio-s-data-respiration', 'bio-short', 4, ['3'], 'Germinating seeds and respiration', `Students measured oxygen consumption by germinating and non-germinating (dormant) pea seeds at two temperatures.\n\n` + T([['Condition', 'O₂ consumed in 20 min (mL)'], ['Germinating, 10 °C', '0.30'], ['Germinating, 25 °C', '0.72'], ['Dormant, 25 °C', '0.05']]),
  `(a) Calculate the rate of oxygen consumption, in mL/min, for germinating peas at 25 °C.
(b) Describe the effect of temperature on oxygen consumption by germinating peas.
(c) Explain why germinating seeds consume more oxygen than dormant seeds.
(d) Identify the purpose of including dormant seeds in the experiment.`,
  [
    { pts: 1, t: '(a) 0.72 mL / 20 min = 0.036 mL/min.', num: [0.036, 0.03] },
    { pts: 1, t: '(b) Higher temperature increases oxygen consumption (0.30 mL at 10 °C versus 0.72 mL at 25 °C).', kw: ['increas|more|higher|greater'] },
    { pts: 1, t: '(c) Germinating seeds are growing and need ATP, so they carry out more cellular respiration, which uses O₂.', kw: ['respiration|atp|energy|metabol', 'grow|germinat|active'] },
    { pts: 1, t: '(d) The dormant seeds serve as a control (or comparison) to show the effect of germination.', kw: ['control|compar|baseline'] },
  ],
  `(a) Rate = 0.72 mL ÷ 20 min = 0.036 mL/min.
(b) Germinating peas consumed more than twice as much oxygen at 25 °C (0.72 mL) as at 10 °C (0.30 mL), so higher temperature increased the rate of respiration.
(c) Germinating seeds are actively growing and dividing, which requires a lot of ATP. They make that ATP by aerobic cellular respiration, which uses O2 as the final electron acceptor.
(d) The dormant seeds are a control that shows how much oxygen is consumed when seeds are not germinating, so the effect of germination can be measured.`, 'Analysis of data');

P('bio-s-investigation-light', 'bio-short', 4, ['3'], 'Light intensity and photosynthesis', `A student uses leaf disks that float when they photosynthesize. She plans to measure how many minutes it takes for half of the disks to float at different distances from a lamp.`,

    { pts: 1, t: '(a) Light intensity (distance from the lamp).', kw: ['distance|light intensity|intensity'] },
    { pts: 1, t: '(b) A controlled variable such as temperature, CO₂ (bicarbonate) concentration, number or size of disks, or type of plant.', kw: ['temperature|bicarbonate|co2|number of disks|size|type of (plant|leaf)|volume'] },
    { pts: 1, t: '(c) The time decreases as the lamp moves closer, because more light increases the rate of photosynthesis.', kw: ['decrease|less|shorter|faster|quicker', 'light|photosynthes'] },
    { pts: 1, t: '(d) Photosynthesis produces O₂, which accumulates in the leaf’s air spaces and makes the disk buoyant.', kw: ['o2|oxygen', 'accumulat|fill|air space|buoyan|less dense|bubble'] },

P('bio-s-concept-meiosis', 'bio-short', 4, ['5'], 'Nondisjunction', `During meiosis in a human, the pair of chromosome 21 homologs fails to separate in meiosis I in one parent.`,
  `(a) Describe what normally happens to homologous chromosomes during meiosis I.
(b) Predict the number of chromosome 21 copies in the gametes produced from this meiosis.
(c) Explain how this event can lead to trisomy 21 in a child.
(d) Explain how meiosis normally contributes to genetic variation.`,
  [
    { pts: 1, t: '(a) Homologous chromosomes pair, may cross over, and separate to opposite poles.', kw: ['separat|move to opposite|pulled apart'] },
    { pts: 1, t: '(b) Two gametes have two copies of chromosome 21 and two have none.', kw: ['two|2', 'zero|none|0|no copies|missing'] },
    { pts: 1, t: '(c) A gamete with two copies fuses with a normal gamete (one copy), giving a zygote with three copies.', kw: ['three|3', 'fertiliz|fuse|combine|normal gamete'] },
    { pts: 1, t: '(d) Crossing over and independent assortment (plus random fertilization) produce new allele combinations.', kw: ['crossing over|independent assortment|random'] },
  ],
  `(a) In meiosis I, homologous chromosomes pair up, can exchange segments by crossing over, and then separate, with one homolog going to each daughter cell.
(b) Two of the four gametes have two copies of chromosome 21, and the other two have no copies.
(c) If a gamete with two copies of chromosome 21 is fertilized by a normal gamete with one copy, the zygote has three copies: trisomy 21.
(d) Crossing over creates chromosomes with new combinations of alleles, and independent assortment of homologous pairs in metaphase I produces many different combinations of chromosomes in the gametes.`, 'Conceptual analysis');

P('bio-s-model-foodweb', 'bio-short', 4, ['8'], 'A lake food web', `In a model of a lake food web, algae are eaten by zooplankton and snails. Zooplankton are eaten by small fish. Snails and small fish are eaten by turtles, and small fish are also eaten by herons.`,
  `(a) Identify an organism that is both a primary consumer and prey for a turtle.

(d) Explain why food chains rarely have more than four or five trophic levels.`,

    { pts: 1, t: '(c) 50,000 → 5,000 (zooplankton) → 500 kcal for small fish.', num: [500, 0.01] },
    { pts: 1, t: '(d) About 90% of energy is lost (mostly as heat) at each level, so too little remains to support more levels.', kw: ['lost|heat|90|10 ?%|little energy|not enough'] },

(d) At each trophic level, about 90% of the energy is lost, mostly as heat from cellular respiration. After four or five levels, too little energy is left to support another population.`, 'Analysis of a model');

P('bio-s-data-gel', 'bio-short', 4, ['6'], 'DNA fingerprints', `DNA from a crime-scene sample and from three suspects was cut with the same restriction enzyme and separated by gel electrophoresis. The crime-scene sample produced bands at 5.0, 3.2, and 1.1 kb. Suspect 1: 5.0, 2.4, 1.1 kb. Suspect 2: 5.0, 3.2, 1.1 kb. Suspect 3: 4.1, 3.2, 0.9 kb.`,
  `(a) Identify which suspect's DNA matches the crime-scene sample.
(b) Explain why DNA fragments separate by size in a gel.
(c) Describe where the 1.1 kb fragment is on the gel relative to the 5.0 kb fragment.
(d) Explain why different people produce different band patterns with the same restriction enzyme.`,
  [
    { pts: 1, t: '(a) Suspect 2.', kw: ['suspect 2|second suspect|suspect two'] },
    { pts: 1, t: '(b) DNA is negatively charged and moves toward the positive electrode; smaller fragments pass through the gel’s pores more easily and travel farther.', kw: ['negative|charge', 'small|size|pore'] },
    { pts: 1, t: '(c) The 1.1 kb fragment is farther from the wells (closer to the positive end).', kw: ['farther|further|closer to the (positive|bottom)|lower|bottom'] },
    { pts: 1, t: '(d) DNA sequence differences change where restriction sites are, so fragment lengths differ.', kw: ['sequence|site|restriction|mutation|variation'] },
  ],
  `(a) Suspect 2, whose bands at 5.0, 3.2, and 1.1 kb match the crime-scene sample exactly.
(b) DNA's phosphate backbone is negatively charged, so fragments move through the gel toward the positive electrode. Smaller fragments slip through the pores of the gel more easily, so they travel farther in the same time.
(c) The 1.1 kb fragment travels farther from the wells, closer to the positive electrode, than the 5.0 kb fragment.
(d) People's DNA sequences differ, so restriction sites are found in different places in different people. Cutting at different places produces fragments of different lengths.`, 'Analysis of data');

/* AP Chemistry · Units 1–3. Original questions written to the public AP Chemistry Course and Exam Description.
   S() = Standard (level 1), H() = Challenge (level 2). The first choice is correct; the engine shuffles. */
(() => {
const [, S, H] = pool('chem');

/* ───────────── Unit 1: Atomic Structure and Properties ───────────── */
S('1', `How many moles of oxygen atoms are in 0.50 mol of {Ca(NO3)2}?`,
  [`3.0 mol`, `1.5 mol`, `0.50 mol`, `6.0 mol`],
  `Each formula unit of {Ca(NO3)2} contains 2 × 3 = 6 O atoms, so 0.50 mol × 6 = 3.0 mol O.`);
S('1', `A sample of pure water and a sample of pure hydrogen peroxide, {H2O2}, are compared. Which statement is true?`,
  [`The mass ratio of oxygen to hydrogen is twice as large in {H2O2} as in {H2O}.`, `Both compounds have the same percent oxygen by mass.`, `{H2O} contains a larger percent oxygen by mass than {H2O2}.`, `The two compounds have the same empirical formula.`],
  `For a fixed mass of hydrogen, {H2O2} contains twice as much oxygen as {H2O} (law of multiple proportions). {H2O2} has empirical formula HO, so its percent oxygen is higher.`);
S('1', `The mass spectrum of an element shows two peaks: 79 amu (50.7%) and 81 amu (49.3%). The element is most likely`,
  [`bromine`, `selenium`, `krypton`, `gold`],
  `The weighted average is about 0.507(79) + 0.493(81) ≈ 80.0 amu, which matches bromine (79.90 g/mol).`);
H('1', `An element has two isotopes with masses 10.0 amu and 11.0 amu. Its average atomic mass is 10.8 amu. What percentage of atoms are the heavier isotope?`,
  [`80%`, `20%`, `8%`, `92%`],
  `Let x = fraction of mass 11.0: 10.0(1 − x) + 11.0x = 10.8, so x = 0.80, or 80%. (This is boron.)`);
S('1', `Which electron configuration represents a ground-state atom of iron?`,
  [`[Ar] 4s^2 3d^6`, `[Ar] 4s^1 3d^7`, `[Ar] 3d^8`, `[Kr] 4s^2 3d^6`],
  `Iron (Z = 26) has 8 electrons beyond argon: 4s fills before 3d in the neutral atom, giving [Ar] 4s^2 3d^6.`);
S('1', `Which ion has the electron configuration 1s^2 2s^2 2p^6?`,
  [`{Mg^2+}`, `{Na^-}`, `{Ca^2+}`, `{Cl^-}`],
  `This is the neon configuration (10 electrons). Mg has 12 electrons, so {Mg^2+} has 10. {Ca^2+} and {Cl^-} have 18.`);
S('1', `Which atom has the largest first ionization energy?`,
  [`F`, `O`, `N`, `C`],
  `Across period 2, effective nuclear charge rises and electrons are held more tightly. F, farthest right of these, has the highest first ionization energy.`);
H('1', `The first ionization energy of oxygen is slightly lower than that of nitrogen. Which explanation is best supported by atomic structure?`,
  [`Oxygen's fourth 2p electron is paired in an orbital, and repulsion between the paired electrons makes it easier to remove.`, `Oxygen has a smaller nuclear charge than nitrogen, so its valence electrons are held less tightly.`, `Oxygen's valence electrons are in a higher energy level than nitrogen's valence electrons.`, `Oxygen has more core electrons than nitrogen, so its valence electrons are better shielded.`],
  `N has three unpaired 2p electrons. In O the fourth 2p electron must pair, and the added electron–electron repulsion lowers the energy needed to remove it. O has more protons, the same shell, and the same core.`);
S('1', `Which species has the largest radius?`,
  [`{S^2-}`, `{Cl^-}`, `{K^+}`, `{Ca^2+}`],
  `All four have 18 electrons. With the same electron count, the species with the fewest protons (S, 16) holds its electrons least tightly and is largest.`);
S('1', `A photoelectron spectrum of an element shows three peaks with relative heights 2 : 2 : 6. The element is`,
  [`neon`, `carbon`, `magnesium`, `oxygen`],
  `Peak heights give electrons per subshell: 1s^2 2s^2 2p^6 is neon. Carbon would be 2 : 2 : 2, and magnesium would show a fourth peak (3s).`);
H('1', `In the photoelectron spectra of sodium and magnesium, the 1s peak of magnesium appears at a higher binding energy than the 1s peak of sodium. The best explanation is that magnesium`,
  [`has one more proton, so its nucleus attracts the 1s electrons more strongly`, `has more electrons in its 1s subshell than sodium`, `has 1s electrons that are farther from the nucleus`, `has a completely filled valence shell, which stabilizes the 1s electrons`],
  `Both atoms have two 1s electrons at about the same distance. Magnesium's nuclear charge is +12 versus +11, so its 1s electrons are bound more tightly.`);
S('1', `Which pair of elements is most likely to form an ionic compound?`,
  [`K and Br`, `C and O`, `S and Cl`, `N and H`],
  `A metal from group 1 with a reactive nonmetal from group 17 has a large electronegativity difference and forms an ionic solid (KBr). The other pairs are nonmetals that share electrons.`);
S('1', `A compound contains 40.0% carbon, 6.7% hydrogen, and 53.3% oxygen by mass. What is its empirical formula?`,
  [`{CH2O}`, `{CHO}`, `{C2H4O}`, `{CH3O}`],
  `Per 100 g: C 40.0/12.01 = 3.33 mol, H 6.7/1.008 = 6.6 mol, O 53.3/16.00 = 3.33 mol. Dividing by 3.33 gives 1 : 2 : 1.`);
H('1', `A 1.000 g sample of a mixture of NaCl and KCl contains 0.550 g of chlorine. Which statement must be true?`,
  [`The mixture contains more NaCl than KCl by mass.`, `The mixture contains more KCl than NaCl by mass.`, `The mixture contains equal masses of NaCl and KCl.`, `The data are inconsistent with any mixture of these two salts.`],
  `Pure NaCl is 60.7% Cl and pure KCl is 47.6% Cl. A mixture at 55.0% Cl lies closer to NaCl's value, so NaCl is the larger part: solving x(0.607) + (1 − x)(0.476) = 0.550 gives x ≈ 0.56 NaCl.`);
S('1', `Coulomb's law predicts that the attraction between a nucleus and an electron increases when`,
  [`the nuclear charge increases or the distance decreases`, `the nuclear charge decreases or the distance increases`, `the number of core electrons increases`, `the electron moves to a higher principal energy level`],
  `F ∝ q₁q₂/r². A larger nuclear charge or a shorter distance increases the attraction. More shielding or a higher energy level lowers it.`);
S('1', `Which element is most likely to form an ion with a 3+ charge?`,
  [`Al`, `Mg`, `Si`, `P`],
  `Aluminum has three valence electrons (3s^2 3p^1) and loses them to reach the neon configuration.`);
H('1', `The successive ionization energies of an element X (in kJ/mol) are 738, 1451, 7733, 10543. X is most likely in which group?`,
  [`Group 2`, `Group 1`, `Group 13`, `Group 14`],
  `The large jump comes after the second electron (1451 → 7733), so X has two valence electrons and the third would come from a core shell. X is a group 2 element (these values fit Mg).`);
S('1', `How many molecules are in 9.0 g of water?`,
  [`3.0 × 10^(23)`, `6.0 × 10^(23)`, `5.4 × 10^(24)`, `1.5 × 10^(23)`],
  `9.0 g ÷ 18.0 g/mol = 0.50 mol; 0.50 × 6.02 × 10^(23) = 3.0 × 10^(23) molecules.`);
S('1', `Which statement about the isotopes carbon-12 and carbon-14 is correct?`,
  [`They have the same number of protons and different numbers of neutrons.`, `They have different numbers of protons and the same number of neutrons.`, `They have different numbers of electrons in neutral atoms.`, `They have different chemical properties because their masses differ.`],
  `Isotopes share atomic number (6 protons) and differ in neutrons (6 versus 8). Neutral atoms of both have 6 electrons, so their chemistry is nearly identical.`);
H('1', `A hydrated salt {CuSO4·xH2O} weighing 2.50 g is heated until all water is removed, leaving 1.60 g of anhydrous {CuSO4} (159.6 g/mol). What is x?`,
  [`5`, `3`, `4`, `6`],
  `Water lost = 0.90 g = 0.050 mol. {CuSO4} = 1.60/159.6 = 0.0100 mol. Ratio 0.050/0.0100 = 5.`);
S('1', `Atoms of which element have the greatest electronegativity?`,
  [`O`, `S`, `Se`, `Te`],
  `Electronegativity decreases down a group because valence electrons are farther from the nucleus. Oxygen is at the top of group 16.`);
H('1', `Element Z forms an oxide with the formula {Z2O3}, and solid Z conducts electricity. Z is most likely`,
  [`Al`, `P`, `Mg`, `N`],
  `{Z2O3} implies a 3+ ion, and electrical conductivity in the solid points to a metal. Aluminum fits both. P and N are nonmetals, and Mg forms MgO.`);
S('1', `Which of the following has the same number of electrons as an argon atom?`,
  [`{Ca^2+}`, `{Na^+}`, `{Br^-}`, `{O^2-}`],
  `Argon has 18 electrons. Calcium (20) loses 2 to give 18. {Na^+} and {O^2-} have 10; {Br^-} has 36.`);

/* ───────────── Unit 2: Compound Structure and Properties ───────────── */
S('2', `What is the shape of a molecule of {NH3}?`,
  [`Trigonal pyramidal`, `Trigonal planar`, `Tetrahedral`, `Bent`],
  `N has three bonding pairs and one lone pair (four electron domains, tetrahedral arrangement). With one lone pair, the molecular shape is trigonal pyramidal.`);
S('2', `Which molecule is nonpolar even though it contains polar bonds?`,
  [`{CO2}`, `{H2O}`, `{NH3}`, `{SO2}`],
  `{CO2} is linear, so its two equal C=O dipoles point in opposite directions and cancel. The others are bent or pyramidal, so their bond dipoles do not cancel.`);
S('2', `What is the hybridization of the carbon atom in formaldehyde, {H2CO}?`,
  [`sp^2`, `sp`, `sp^3`, `sp^3d`],
  `Carbon has three electron domains (two C–H and one C=O), so it is sp^2 hybridized with trigonal planar geometry.`);
H('2', `The nitrate ion, {NO3^-}, is drawn with three resonance structures. Which statement best describes the actual ion?`,
  [`All three N–O bonds are identical, with a length between a single and a double bond.`, `One N–O bond is a double bond and two are single bonds, and the double bond rapidly moves between positions.`, `Two N–O bonds are double bonds and one is a single bond.`, `The N–O bonds have three different lengths, one for each resonance structure.`],
  `Resonance structures describe one delocalized structure. The bond order is 4/3, and all three bonds are the same length, between a single and a double bond.`);
S('2', `Which compound has the highest lattice energy?`,
  [`MgO`, `NaCl`, `KBr`, `NaF`],
  `Lattice energy rises with ion charge and falls with ion size (Coulomb's law). MgO has 2+ and 2− ions that are small, so its attractions are strongest.`);
S('2', `Brass is made by mixing copper and zinc atoms, which are similar in size. Brass is best described as`,
  [`a substitutional alloy`, `an interstitial alloy`, `an ionic solid`, `a covalent network solid`],
  `When atoms of similar radius replace one another in a metallic lattice, the alloy is substitutional. Interstitial alloys, such as steel, have small atoms filling holes between larger ones.`);
S('2', `How many valence electrons are shown in a correct Lewis diagram of {SO4^2-}?`,
  [`32`, `30`, `24`, `34`],
  `S contributes 6, four O atoms contribute 24, and the 2− charge adds 2: 6 + 24 + 2 = 32.`);
H('2', `For the thiocyanate ion, {SCN^-}, which Lewis structure is favored by formal charge?`,
  [`[S=C=N]^−, with a −1 formal charge on N`, `[S≡C–N]^−, with a −2 formal charge on N`, `[S–C≡N]^−, with a −1 formal charge on C`, `[S=C=N]^−, with a −1 formal charge on S`],
  `In S=C=N with two lone pairs on S and on N, S is 0, C is 0, and N is −1. The negative charge sits on the most electronegative atom, N, which is the favored distribution.`);
S('2', `The graph of potential energy versus internuclear distance for two H atoms has a minimum at 74 pm. What does this distance represent?`,
  [`The bond length of {H2}`, `The distance at which the atoms no longer interact`, `The distance at which repulsion is greatest`, `The radius of one hydrogen atom`],
  `The potential-energy minimum is the most stable separation, where attraction and repulsion balance. That separation is the bond length; its depth is the bond energy.`);
H('2', `Which bond has the greatest bond energy?`,
  [`C≡O`, `C=O`, `C–O`, `O–O`],
  `More shared electron pairs give a shorter, stronger bond. The triple bond in carbon monoxide is among the strongest known.`);
S('2', `Which property is characteristic of metallic solids but not of ionic solids?`,
  [`Good electrical conductivity in the solid state`, `A high melting point in most cases`, `Brittleness when the solid is struck`, `An orderly, repeating crystalline structure`],
  `Metals conduct as solids because their valence electrons are delocalized. Ionic solids conduct only when melted or dissolved because their ions are fixed in place.`);
S('2', `What are the electron-domain geometry and molecular shape of {SF4}?`,
  [`Trigonal bipyramidal; seesaw`, `Tetrahedral; tetrahedral`, `Octahedral; square planar`, `Trigonal bipyramidal; T-shaped`],
  `S has four bonding pairs and one lone pair (five domains). The lone pair sits in an equatorial position, giving a seesaw shape.`);
H('2', `Silicon dioxide melts at about 1700 °C, while carbon dioxide sublimes at −78 °C. The best explanation is that`,
  [`{SiO2} is a covalent network solid, so melting breaks covalent bonds, while solid {CO2} is held together by weak intermolecular forces`, `Si–O bonds are ionic, while C=O bonds are covalent`, `{SiO2} molecules are much heavier than {CO2} molecules, so they have stronger London forces`, `{SiO2} molecules are polar, while {CO2} molecules are nonpolar`],
  `There are no discrete {SiO2} molecules: each Si bonds to four O atoms in an extended network. Melting it breaks strong covalent bonds. Solid {CO2} contains separate molecules attracted only by London forces.`);
S('2', `Which molecule has a bond angle of about 120°?`,
  [`{BF3}`, `{CH4}`, `{H2O}`, `{BeCl2}`],
  `{BF3} has three bonding domains and no lone pairs on B: trigonal planar, 120°. {CH4} is 109.5°, {H2O} about 104.5°, {BeCl2} 180°.`);
S('2', `How many sigma (σ) and pi (π) bonds are in a molecule of ethyne, {C2H2}?`,
  [`3 σ and 2 π`, `2 σ and 3 π`, `5 σ and 0 π`, `3 σ and 1 π`],
  `H–C≡C–H has two C–H σ bonds plus the triple bond (one σ and two π). Total: 3 σ and 2 π.`);
H('2', `Which statement explains why the H–O–H angle in water (104.5°) is smaller than the H–N–H angle in ammonia (107°)?`,
  [`Water has two lone pairs on the central atom, and lone pairs repel bonding pairs more strongly than bonding pairs repel each other.`, `Oxygen is more electronegative than nitrogen, so it pulls the hydrogen atoms closer together.`, `Water has fewer electron domains around the central atom than ammonia.`, `The O–H bond is longer than the N–H bond, which squeezes the bond angle.`],
  `Both have four electron domains. Lone pairs occupy more space than bonding pairs; water's two lone pairs compress the H–O–H angle more than ammonia's single lone pair compresses H–N–H.`);
S('2', `An ionic compound is brittle because`,
  [`shifting a layer brings like-charged ions together, and they repel`, `its ions are held together only by weak intermolecular forces`, `its delocalized electrons let layers slide past each other easily`, `its bonds are directional covalent bonds that break under stress`],
  `In an ionic lattice, cations neighbor anions. A small shift lines up cations with cations and anions with anions, and the repulsion cleaves the crystal.`);
H('2', `Which species has a central atom with an expanded octet?`,
  [`{XeF4}`, `{CF4}`, `{NF3}`, `{BF4^-}`],
  `Xe in {XeF4} has four bonding pairs and two lone pairs, twelve electrons around Xe. Elements in period 2 (C, N, B) cannot exceed an octet.`);
S('2', `Which is the best Lewis description of the carbonate ion, {CO3^2-}?`,
  [`Three resonance structures, each with one C=O double bond and two C–O single bonds`, `One structure with three C=O double bonds`, `One structure with three C–O single bonds and a lone pair on carbon`, `Two resonance structures, each with two C=O double bonds`],
  `Carbon makes four bonds: one double and two single bonds to oxygen. The double bond can be placed at any of three O atoms, giving three equivalent resonance structures.`);

/* ───────────── Unit 3: Properties of Substances and Mixtures ───────────── */
S('3', `Which substance has the highest boiling point?`,
  [`{H2O}`, `{H2S}`, `{H2Se}`, `{CH4}`],
  `Water forms hydrogen bonds, which are much stronger than the dipole and London forces in {H2S} and {H2Se}. {CH4} has only weak London forces.`);
S('3', `Which intermolecular forces are present between molecules of {CH3OH}?`,
  [`Hydrogen bonding, dipole–dipole, and London forces`, `Only London dispersion forces, since it is a small molecule`, `Only hydrogen bonding, which replaces the other forces`, `Ionic attractions and London dispersion forces`],
  `Methanol has an O–H group, so it forms hydrogen bonds. It is polar, so dipole–dipole forces act, and all molecules have London forces.`);
S('3', `Why does {I2} have a higher boiling point than {Cl2}?`,
  [`{I2} has a larger, more polarizable electron cloud, so its London forces are stronger.`, `{I2} molecules are polar because iodine atoms are larger, but {Cl2} molecules are nonpolar.`, `The I–I covalent bond is stronger than the Cl–Cl bond, so more energy is needed.`, `{I2} forms hydrogen bonds with neighboring molecules, but {Cl2} does not.`],
  `Both are nonpolar. Larger electron clouds are more polarizable, producing stronger temporary dipoles. Boiling separates molecules; it does not break the I–I bond.`);
H('3', `Propanal ({CH3CH2CHO}) and 1-propanol ({CH3CH2CH2OH}) have similar molar masses. 1-propanol boils about 50 °C higher. Which statement best explains this?`,
  [`1-propanol molecules can hydrogen bond to each other through their O–H groups, while propanal molecules cannot.`, `Propanal is nonpolar, so it has only London dispersion forces.`, `1-propanol has more electrons, so its London forces are much stronger.`, `The C=O bond in propanal is weaker than the C–O bond in 1-propanol.`],
  `Propanal is polar (dipole–dipole forces) but has no H bonded to O, so it cannot hydrogen bond with itself. 1-propanol's O–H groups form hydrogen bonds, which raise its boiling point.`);
S('3', `A 2.00 mol sample of an ideal gas is held at 300. K in a 10.0 L container. What is the pressure? (R = 0.08206 L·atm/(mol·K))`,
  [`4.92 atm`, `2.46 atm`, `0.203 atm`, `49.2 atm`],
  `P = nRT/V = (2.00)(0.08206)(300.)/10.0 = 4.92 atm.`);
S('3', `At the same temperature, how does the average speed of {He} atoms compare with that of {CH4} molecules?`,
  [`He atoms move twice as fast on average.`, `They have the same average speed because the temperature is the same.`, `{CH4} molecules move twice as fast on average.`, `He atoms move four times as fast on average.`],
  `At equal temperature, average kinetic energy is equal, so speed ∝ 1/√M. M(CH₄)/M(He) = 16/4 = 4, and √4 = 2.`);
H('3', `Under which conditions does a real gas behave most like an ideal gas?`,
  [`High temperature and low pressure`, `Low temperature and high pressure`, `Low temperature and low pressure`, `High temperature and high pressure`],
  `At low pressure, molecules are far apart, so their own volume is negligible. At high temperature, their kinetic energy is large compared with intermolecular attractions.`);
H('3', `At high pressure, the measured pressure of a sample of {NH3} is lower than the pressure calculated with the ideal gas law. The best explanation is that`,
  [`attractions between {NH3} molecules reduce the force of their collisions with the walls`, `the volume of the {NH3} molecules makes the space available to them smaller`, `{NH3} molecules move faster than ideal gas particles`, `{NH3} molecules collide with the walls more often than ideal gas particles`],
  `Polar {NH3} molecules attract one another, which slows them as they approach the walls and lowers the pressure. Molecular volume alone would make the real pressure higher than ideal.`);
S('3', `A gas mixture contains 0.30 mol {N2} and 0.10 mol {O2} at a total pressure of 2.0 atm. What is the partial pressure of {O2}?`,
  [`0.50 atm`, `0.67 atm`, `1.5 atm`, `0.20 atm`],
  `Mole fraction of {O2} = 0.10/0.40 = 0.25; P(O₂) = 0.25 × 2.0 atm = 0.50 atm.`);
S('3', `What is the molarity of a solution made by dissolving 0.250 mol of NaCl in enough water to make 500. mL of solution?`,
  [`0.500 M`, `0.125 M`, `2.00 M`, `0.250 M`],
  `M = mol/L = 0.250 mol ÷ 0.500 L = 0.500 M.`);
H('3', `What volume of 6.0 M HCl is needed to prepare 250 mL of 0.30 M HCl?`,
  [`12.5 mL`, `5.0 mL`, `25 mL`, `50 mL`],
  `M₁V₁ = M₂V₂: V₁ = (0.30)(250 mL)/6.0 = 12.5 mL.`);
S('3', `In paper chromatography with a polar solvent, a dye that travels farthest up the paper is most likely`,
  [`the most attracted to the solvent compared with the paper`, `the most attracted to the paper compared with the solvent`, `the dye with the largest molar mass`, `the least soluble dye in the solvent`],
  `A component moves farther when its attraction to the mobile phase (solvent) is strong relative to its attraction to the stationary phase (paper).`);
S('3', `Which substance is most soluble in hexane, {C6H14}?`,
  [`{C8H18}`, `NaCl`, `{CH3OH}`, `{H2O}`],
  `"Like dissolves like." Hexane is nonpolar, so nonpolar octane mixes with it through London forces. Ionic and hydrogen-bonding substances do not.`);
H('3', `Ethanol and water mix in all proportions, but octanol is only slightly soluble in water. The best explanation is that`,
  [`octanol's long nonpolar chain interacts poorly with water, outweighing its one O–H group`, `octanol has no O–H group, so it cannot form any hydrogen bonds with water molecules`, `octanol molecules are too heavy for water molecules to surround and carry into solution`, `ethanol ionizes completely in water, while octanol stays as intact molecules`],
  `Both alcohols can hydrogen bond with water through O–H. In octanol, the eight-carbon chain dominates; inserting it into water disrupts water's hydrogen bonds without forming comparable new attractions.`);
S('3', `Which type of electromagnetic radiation is associated with transitions between molecular vibrational energy levels?`,
  [`Infrared`, `Ultraviolet`, `Microwave`, `X-ray`],
  `Infrared photons match vibrational energy spacings. Microwaves excite rotations, and visible/UV radiation excites electronic transitions.`);
S('3', `What is the energy of a photon with a wavelength of 500. nm? (h = 6.626 × 10^(−34) J·s, c = 3.00 × 10^(8) m/s)`,
  [`3.98 × 10^(−19) J`, `3.98 × 10^(−28) J`, `1.33 × 10^(−27) J`, `1.99 × 10^(−25) J`],
  `E = hc/λ = (6.626 × 10^(−34))(3.00 × 10^(8))/(500. × 10^(−9) m) = 3.98 × 10^(−19) J.`);
H('3', `A solution of a colored compound has an absorbance of 0.40 at its λ<sub>max</sub>. If the solution is diluted to half its concentration and measured in the same cuvette, what absorbance is expected?`,
  [`0.20`, `0.80`, `0.40`, `0.10`],
  `Beer–Lambert law: A = εbc. With ε and b fixed, absorbance is proportional to concentration, so halving c halves A.`);
H('3', `A student makes a calibration curve of absorbance versus concentration for a dye. The cuvette used for the unknown has a fingerprint on it that absorbs some light. The calculated concentration of the unknown will be`,
  [`too high, because the measured absorbance is larger than the dye alone would produce`, `too low, because less light reaches the sample`, `unaffected, because the fingerprint does not contain dye`, `too low, because the path length is shorter`],
  `Any extra light blocked is read as extra absorbance. A larger absorbance on the calibration line corresponds to a larger concentration.`);
S('3', `Which kind of solid is likely to be soft, have a low melting point, and not conduct electricity in any state?`,
  [`A molecular solid such as solid {I2}`, `An ionic solid such as KCl`, `A metallic solid such as Cu`, `A covalent network solid such as diamond`],
  `Molecular solids are held by weak intermolecular forces (low melting, soft) and have no mobile charges.`);
H('3', `A rigid container holds gas at 27 °C and 1.20 atm. It is heated to 127 °C. What is the new pressure?`,
  [`1.60 atm`, `5.64 atm`, `0.900 atm`, `1.47 atm`],
  `At constant volume and moles, P ∝ T (in kelvins): P₂ = 1.20 atm × (400 K/300 K) = 1.60 atm. Using Celsius temperatures gives the wrong ratio.`);
S('3', `Which gas has the greatest density at STP?`,
  [`{CO2}`, `{N2}`, `{O2}`, `{CH4}`],
  `At the same T and P, equal volumes contain equal moles, so density is proportional to molar mass. {CO2} (44 g/mol) is heaviest.`);
H('3', `A 0.500 g sample of a gas occupies 0.250 L at 300. K and 1.00 atm. What is its molar mass?`,
  [`49.2 g/mol`, `24.6 g/mol`, `12.3 g/mol`, `98.5 g/mol`],
  `n = PV/RT = (1.00)(0.250)/(0.08206 × 300.) = 0.01016 mol; M = 0.500 g/0.01016 mol = 49.2 g/mol.`);
S('3', `When NaCl dissolves in water, the {Na^+} ions are attracted mainly to which part of the water molecules?`,
  [`The oxygen atoms, which carry a partial negative charge`, `The hydrogen atoms, which carry a partial positive charge`, `The lone pairs of the chloride ions`, `The O–H covalent bonds`],
  `Ion–dipole attractions: cations are surrounded by the partially negative O ends of water molecules, and anions by the partially positive H ends.`);
H('3', `The vapor pressure of liquid A is higher than that of liquid B at 25 °C. Which statement must be true?`,
  [`Liquid A has weaker intermolecular forces and a lower normal boiling point than liquid B.`, `Liquid A has a higher molar mass than liquid B.`, `Liquid A is polar and liquid B is nonpolar.`, `Liquid A has a higher heat of vaporization than liquid B.`],
  `Weaker intermolecular forces let more molecules escape at a given temperature, raising vapor pressure. Such a liquid reaches 1 atm vapor pressure at a lower temperature.`);
S('3', `Which statement about the photoelectric effect is correct?`,
  [`Electrons are ejected only when each photon's energy exceeds the metal's work function.`, `Brighter light of any color always ejects electrons.`, `The kinetic energy of ejected electrons increases with light intensity.`, `Longer wavelengths eject electrons with more kinetic energy.`],
  `Each photon delivers E = hν. Below the threshold frequency, no electrons are ejected however intense the light; above it, intensity changes the number of electrons, not their energy.`);
H('3', `Two flasks of equal volume at the same temperature contain {H2} and {CO2}. The {H2} flask is at 2 atm and the {CO2} flask at 1 atm. Which quantity is greater for the {H2} sample?`,
  [`The number of molecules`, `The average kinetic energy per molecule`, `The mass of gas`, `The density of the gas`],
  `At the same V and T, n ∝ P, so the {H2} flask has twice as many molecules. Average kinetic energy depends only on temperature. Mass: 2 mol × 2 g < 1 mol × 44 g, so {CO2} is heavier and denser.`);
S('3', `Which substance has the strongest London dispersion forces?`,
  [`{C8H18}`, `{C2H6}`, `{CH4}`, `{C4H10}`],
  `London forces grow with the number of electrons and the surface area of contact. Octane is the largest of these alkanes.`);

CASE({ id: 'chem-l-n2o5', band: 'chem-long', label: 'Long free response', max: 10, units: ['5'], title: 'Decomposition of dinitrogen pentoxide',
  intro: `Dinitrogen pentoxide decomposes in the gas phase at a constant temperature:\n\n{2N2O5(g) -> 4NO2(g) + O2(g)}\n\nA student measures the concentration of {N2O5} over time. The data are shown below.\n\n` + T([['Time (s)', '[{N2O5}] (M)'], ['0', '0.0200'], ['500', '0.0141'], ['1000', '0.0100'], ['1500', '0.0071'], ['2000', '0.0050']]),
  docs: [],
  prompts: [{ id: 'chem-l-n2o5-1', cat: 'FRQ',
    q: `(a) Determine the order of the reaction with respect to {N2O5}. Justify your answer using the data.
(b) Calculate the rate constant, k, for the reaction. Include units.
(c) Calculate the concentration of {N2O5} at 3000 s.
(d) At one moment, {N2O5} is being consumed at a rate of 1.4 × 10^(−5) M/s. Calculate the rate at which {NO2} is being produced at that moment.
(e) A proposed mechanism begins with the slow step {N2O5 -> NO2 + NO3}, followed by fast steps. Is this mechanism consistent with the rate law you determined? Justify your answer.
(f) Using collision theory, explain why the rate constant increases when the temperature is raised.`,
    rubric: [
      { pts: 1, t: '(a) First order with respect to N₂O₅.', kw: ['first|1st'] },
      { pts: 1, t: '(a) Justification: the half-life is constant (1000 s each time the concentration halves), or ln[N₂O₅] vs. time is linear.', kw: ['half.?li|1000 ?s|ln|natural log|linear|constant'] },
      { pts: 1, t: '(b) k = 0.693/t½ = 0.693/1000 s = 6.93 × 10⁻⁴ (accept 6.9 × 10⁻⁴ to 7.0 × 10⁻⁴).', num: [6.93e-4, 0.03] },
      { pts: 1, t: '(b) Units of s⁻¹ for a first-order rate constant.', kw: ['s\\^?\\(?[-−]1|/ ?s\\b|per second|1/s|s−1|s-1'] },
      { pts: 1, t: '(c) 3000 s is three half-lives: [N₂O₅] = 0.0200 × (½)³ = 0.0025 M.', num: [0.0025, 0.05] },
      { pts: 1, t: '(d) Rate of NO₂ formation = (4/2)(1.4 × 10⁻⁵) = 2.8 × 10⁻⁵ M/s.', num: [2.8e-5, 0.03] },
      { pts: 1, t: '(e) Yes, the mechanism is consistent.', kw: ['consistent|yes|agrees|matches'] },

    ],

      { pts: 1, t: '(d) The added H⁺ is consumed by the conjugate base (acetate), so the ratio [A⁻]/[HA] changes only a little.', kw: ['acetate|conjugate base|ch3coo|a-|base', 'react|consum|neutraliz|ratio|remov'] },
    ],
    sample: `(a) Because [CH3COO-] = [CH3COOH], pH = pKa = −log(1.8 × 10^-5) = 4.74.
(b) CH3COO-(aq) + H+(aq) → CH3COOH(aq)
(c) The 0.10 mol H+ converts 0.10 mol acetate to acetic acid: CH3COO- = 0.40 mol, CH3COOH = 0.60 mol. pH = 4.74 + log(0.40/0.60) = 4.74 − 0.18 = 4.56.
(d) The strong acid reacts with the acetate ions (the conjugate base) and is converted to the weak acid, so few free H+ ions remain. The ratio of acetate to acetic acid changes only from 1.0 to 0.67, so the pH drops only slightly.` }] });

CASE({ id: 'chem-l-ethanol', band: 'chem-long', label: 'Long free response', max: 10, units: ['3', '4', '6'], title: 'Ethanol and dimethyl ether',
  intro: `Ethanol, {CH3CH2OH}, and dimethyl ether, {CH3OCH3}, have the same molecular formula, {C2H6O}. Their properties are shown below.\n\n` + T([['Substance', 'Molar mass (g/mol)', 'Normal boiling point (°C)'], ['Ethanol', '46.07', '78'], ['Dimethyl ether', '46.07', '−24']]) + `\n\nStandard enthalpies of formation: {C2H5OH}(l) −277.7 kJ/mol, {CO2}(g) −393.5 kJ/mol, {H2O}(l) −285.8 kJ/mol.`,
  docs: [],
  prompts: [{ id: 'chem-l-ethanol-1', cat: 'FRQ',
    q: `(a) Draw a complete Lewis electron-dot diagram for each molecule. Show all bonding and nonbonding electrons.
(b) Explain the difference in boiling points in terms of the intermolecular forces of each substance.
(c) Write the balanced equation for the complete combustion of liquid ethanol.
(d) A 4.61 g sample of ethanol burns completely. Calculate the volume of {CO2}(g) produced at 298 K and 1.00 atm.
(e) Using the enthalpies of formation, calculate ΔH° for the combustion of 1 mol of ethanol.
(f) Calculate the heat released when the 4.61 g sample burns.
(g) A student measures the heat of combustion of ethanol with a calorimeter that loses heat to the room. Will the magnitude of the student's measured ΔH be greater than, less than, or equal to the true value? Justify your answer.`,
    rubric: [
      { pts: 1, t: '(a) Correct Lewis diagrams: ethanol with an O–H bond and two lone pairs on O; dimethyl ether with C–O–C and two lone pairs on O.', kw: ['lone|pair|dots|o.?h', 'c.?o.?c|ether'] },
      { pts: 1, t: '(b) Ethanol molecules hydrogen bond with each other through O–H.', kw: ['hydrogen bond|h-bond|h bond'] },
      { pts: 1, t: '(b) Dimethyl ether has dipole–dipole forces but no H bonded to O, so it cannot hydrogen bond with itself; its forces are weaker, giving a lower boiling point.', kw: ['dipole|no h|cannot|can.?t|no hydrogen|not .*bonded to o', 'weaker|lower|less'] },
      { pts: 1, t: '(c) C₂H₅OH(l) + 3O₂(g) → 2CO₂(g) + 3H₂O(l).', kw: ['3 ?o2', '2 ?co2', '3 ?h2o'] },
      { pts: 1, t: '(d) mol ethanol = 4.61/46.07 = 0.100 mol, so mol CO₂ = 0.200 mol.', num: [0.200, 0.03] },
      { pts: 1, t: '(d) V = nRT/P = (0.200)(0.08206)(298)/1.00 = 4.89 L.', num: [4.89, 0.02] },
      { pts: 1, t: '(e) Correct setup: ΔH° = [2(−393.5) + 3(−285.8)] − [(−277.7) + 3(0)].', kw: ['393\\.5', '285\\.8', '277\\.7'] },
      { pts: 1, t: '(e) ΔH° = −1366.7 kJ/mol (accept −1367).', num: [-1366.7, 0.004] },
      { pts: 1, t: '(f) q = 0.100 mol × 1366.7 kJ/mol = 137 kJ released (consistent with part (e)).', num: [136.7, 0.02] },
      { pts: 1, t: '(g) Less than the true value: heat lost to the room is not measured, so less heat appears to be released.', kw: ['less|smaller|lower|underestimat', 'lost|escap|room|surroundings|not (measured|absorbed|captured)'] },
    ],
    sample: `(a) Ethanol: H3C–CH2–O–H, with each C making four single bonds and two lone pairs on O. Dimethyl ether: H3C–O–CH3, with two lone pairs on O.
(b) Both are polar and have similar London forces (same molar mass). Ethanol has an H bonded directly to O, so ethanol molecules hydrogen bond with each other. Dimethyl ether has only dipole–dipole and London forces because its H atoms are bonded to C. Ethanol's stronger intermolecular forces require more energy to overcome, so it boils at a higher temperature.
(c) C2H5OH(l) + 3O2(g) → 2CO2(g) + 3H2O(l)
(d) n(ethanol) = 4.61 g ÷ 46.07 g/mol = 0.100 mol; n(CO2) = 2 × 0.100 = 0.200 mol. V = nRT/P = (0.200)(0.08206)(298)/1.00 = 4.89 L.
(e) ΔH° = [2(−393.5) + 3(−285.8)] − [(−277.7) + 3(0)] = −1644.4 + 277.7 = −1366.7 kJ/mol.
(f) q = 0.100 mol × 1366.7 kJ/mol = 137 kJ released.
(g) Less than the true value. Some heat released by the reaction escapes to the room instead of warming the calorimeter, so the measured temperature change and the calculated heat are too small.` }] });

CASE({ id: 'chem-l-pcl5', band: 'chem-long', label: 'Long free response', max: 10, units: ['7'], title: 'Decomposition of phosphorus pentachloride',
  intro: `A 0.400 mol sample of {PCl5}(g) is placed in an evacuated 2.00 L rigid flask and heated to 500 K. It decomposes according to the equation\n\n{PCl5(g) <=> PCl3(g) + Cl2(g)}\n\nWhen equilibrium is reached, 0.250 mol of {PCl5} remains in the flask.`,
  docs: [],
  prompts: [{ id: 'chem-l-pcl5-1', cat: 'FRQ',
    q: `(a) Write the expression for the equilibrium constant, K<sub>c</sub>.
(b) Calculate the equilibrium concentrations of {PCl5}, {PCl3}, and {Cl2}.
(c) Calculate the value of K<sub>c</sub> at 500 K.
(d) Calculate the value of K<sub>p</sub> at 500 K.
(e) The volume of the flask is suddenly halved at constant temperature. Predict the direction the reaction will shift. Justify your prediction by comparing Q with K.
(f) Helium gas is added to the original equilibrium mixture at constant volume. Does the amount of {PCl3} increase, decrease, or stay the same? Justify your answer.
(g) The forward reaction is endothermic. Predict whether K<sub>c</sub> at 600 K is greater than, less than, or equal to K<sub>c</sub> at 500 K.
(h) In a separate experiment, 0.100 mol of {Cl2} is added to the original equilibrium mixture at constant volume. Calculate Q immediately after the addition and determine the direction of the net reaction.`,
    rubric: [
      { pts: 1, t: '(a) Kc = [PCl₃][Cl₂]/[PCl₅].', kw: ['pcl3', 'cl2', 'pcl5'] },
      { pts: 1, t: '(b) [PCl₅] = 0.125 M; [PCl₃] = [Cl₂] = 0.0750 M.', num: [0.075, 0.02] },
      { pts: 1, t: '(c) Kc = (0.0750)²/0.125 = 0.0450 (consistent with part (b)).', num: [0.045, 0.03] },
      { pts: 1, t: '(d) Kp = Kc(RT)^Δn = 0.0450 × (0.08206 × 500)¹ = 1.85.', num: [1.85, 0.02] },
      { pts: 1, t: '(e) The reaction shifts toward reactants (toward PCl₅).', kw: ['reactant|left|reverse|pcl5|backward'] },
      { pts: 1, t: '(e) Halving V doubles all concentrations, so Q = (2·2)/2 × K = 2K > K; the net reaction goes in reverse.', kw: ['q ?>|greater than k|q is (greater|larger|bigger)|doubles|2k|twice'] },
      { pts: 1, t: '(f) Stays the same: concentrations (partial pressures) of the reacting gases do not change, so Q still equals K.', kw: ['same|no change|unchanged|not change|does not shift|no shift'] },
      { pts: 1, t: '(g) Greater: for an endothermic reaction, raising temperature increases K.', kw: ['greater|larger|increase|higher'] },
      { pts: 1, t: '(h) [Cl₂] = 0.125 M; Q = (0.0750)(0.125)/0.125 = 0.0750.', num: [0.075, 0.02] },
      { pts: 1, t: '(h) Q > K, so the net reaction proceeds in reverse (toward PCl₅).', kw: ['q ?>|greater than k|reverse|left|reactant'] },
    ],
    sample: `(a) Kc = [PCl3][Cl2]/[PCl5]
(b) 0.400 − 0.250 = 0.150 mol PCl5 reacted, forming 0.150 mol each of PCl3 and Cl2. In 2.00 L: [PCl5] = 0.125 M, [PCl3] = [Cl2] = 0.0750 M.
(c) Kc = (0.0750)(0.0750)/0.125 = 0.0450
(d) Δn(gas) = 2 − 1 = 1, so Kp = Kc(RT) = 0.0450 × (0.08206)(500) = 1.85.
(e) The reaction shifts toward PCl5. Halving the volume doubles every concentration, so Q = (2)(2)/(2) × 0.0450 = 0.0900, which is greater than K. The net reaction proceeds in reverse until Q = K, reducing the number of gas molecules.
(f) The amount of PCl3 stays the same. Adding helium at constant volume does not change the concentrations of PCl5, PCl3, or Cl2, so Q still equals K and there is no shift.
(g) Greater. For an endothermic reaction, heat acts like a reactant, so raising the temperature shifts the equilibrium toward products and increases K.
(h) [Cl2] = (0.150 + 0.100)/2.00 = 0.125 M. Q = (0.0750)(0.125)/0.125 = 0.0750. Since Q > K (0.0450), the net reaction proceeds in reverse, forming PCl5.` }] });

CASE({ id: 'chem-l-titration', band: 'chem-long', label: 'Long free response', max: 10, units: ['8'], title: 'Titration of an unknown weak acid',
  intro: `A student titrates 25.0 mL of 0.100 M HA, an unknown weak monoprotic acid, with 0.100 M NaOH at 25 °C. Selected points from the titration curve are shown below.\n\n` + T([['Volume of NaOH added (mL)', 'pH'], ['0.0', '2.88'], ['12.5', '4.74'], ['25.0', '8.72'], ['30.0', '?']]) + `\n\nAvailable indicators: methyl orange (pH 3.1–4.4), bromothymol blue (pH 6.0–7.6), phenolphthalein (pH 8.2–10.0).`,
  docs: [],
  prompts: [{ id: 'chem-l-titration-1', cat: 'FRQ',
    q: `(a) Using the initial pH, calculate the value of K<sub>a</sub> for HA.
(b) Identify the pK<sub>a</sub> of HA from the data, and explain why the pH at that point equals pK<sub>a</sub>.
(c) Write the net ionic equation for the reaction between HA and NaOH.
(d) Explain why the pH at the equivalence point is greater than 7.
(e) Calculate the concentration of {A^-} at the equivalence point.
(f) Which indicator from the list is best for this titration? Justify your choice.
(g) Calculate the pH after 30.0 mL of NaOH has been added.`,
    rubric: [
      { pts: 1, t: '(a) [H⁺] = 10^−2.88 = 1.32 × 10⁻³ M = [A⁻].', num: [1.32e-3, 0.03] },
      { pts: 1, t: '(a) Ka = (1.32 × 10⁻³)²/(0.100 − 0.00132) ≈ 1.8 × 10⁻⁵ (accept 1.7–1.8 × 10⁻⁵).', num: [1.76e-5, 0.06] },
      { pts: 1, t: '(b) pKa = 4.74 (the pH at 12.5 mL, the half-equivalence point).', kw: ['4\\.74'] },
      { pts: 1, t: '(b) At half-equivalence, half the HA has been converted to A⁻, so [HA] = [A⁻] and log([A⁻]/[HA]) = 0.', kw: ['half', 'equal|=|same'] },
      { pts: 1, t: '(c) HA + OH⁻ → A⁻ + H₂O.', kw: ['oh', 'a-|a−|a\\^-|a⁻|conjugate', 'h2o|water'] },
      { pts: 1, t: '(d) At equivalence the solution contains A⁻, a weak base that reacts with water to produce OH⁻.', kw: ['base|oh|hydroxide', 'a-|a−|a⁻|conjugate|reacts with water|hydroly'] },
      { pts: 1, t: '(e) [A⁻] = 2.50 × 10⁻³ mol / 0.0500 L = 0.0500 M.', num: [0.05, 0.02] },
      { pts: 1, t: '(f) Phenolphthalein, because its color-change range (8.2–10.0) includes the equivalence-point pH of 8.72.', kw: ['phenolphthalein', '8\\.72|8\\.2|range|equivalence'] },
      { pts: 1, t: '(g) Excess OH⁻ = 3.00 − 2.50 = 0.50 mmol in 55.0 mL: [OH⁻] = 9.09 × 10⁻³ M.', num: [9.09e-3, 0.03] },
      { pts: 1, t: '(g) pOH = 2.04, pH = 11.96.', num: [11.96, 0.003] },
    ],
    sample: `(a) [H+] = 10^-2.88 = 1.32 × 10^-3 M. HA ⇌ H+ + A−, so [A−] = 1.32 × 10^-3 M and [HA] = 0.100 − 0.00132 = 0.0987 M. Ka = (1.32 × 10^-3)^2 / 0.0987 = 1.76 × 10^-5.
(b) pKa = 4.74. At 12.5 mL, half of the HA has reacted, so [HA] = [A−]. Then pH = pKa + log([A−]/[HA]) = pKa + log(1) = pKa.
(c) HA(aq) + OH−(aq) → A−(aq) + H2O(l)
(d) At the equivalence point all HA has been converted to A−, the conjugate base of a weak acid. A− reacts with water (A− + H2O ⇌ HA + OH−), producing OH−, so the pH is above 7.
(e) mol A− = 0.0250 L × 0.100 M = 2.50 × 10^-3 mol in 50.0 mL total: [A−] = 0.0500 M.
(f) Phenolphthalein. Its color change range, pH 8.2–10.0, includes the equivalence-point pH of 8.72; the others change color well before equivalence.
(g) mol OH− added = 3.00 mmol; HA = 2.50 mmol; excess OH− = 0.50 mmol in 55.0 mL: [OH−] = 9.09 × 10^-3 M. pOH = 2.04, pH = 11.96.` }] });

CASE({ id: 'chem-l-cell', band: 'chem-long', label: 'Long free response', max: 10, units: ['9'], title: 'A nickel–silver galvanic cell',
  intro: `A galvanic cell is built from a nickel electrode in 1.0 M {Ni(NO3)2} and a silver electrode in 1.0 M {AgNO3}. The half-cells are connected by a wire and a salt bridge containing {KNO3}.\n\n` + T([['Half-reaction', 'E° (V)'], ['{Ag^+(aq) + e^- -> Ag(s)}', '+0.80'], ['{Ni^2+(aq) + 2e^- -> Ni(s)}', '−0.25']]),
  docs: [],
  prompts: [{ id: 'chem-l-cell-1', cat: 'FRQ',
    q: `(a) Identify the anode and the cathode.
(b) Write the balanced net ionic equation for the overall cell reaction.
(c) Calculate E°<sub>cell</sub>.
(d) Calculate ΔG° for the cell reaction. Include units.
(e) Describe the direction of electron flow in the wire and the direction {K^+} ions move in the salt bridge.
(f) The {Ag^+} concentration is lowered to 0.010 M while [{Ni^2+}] stays at 1.0 M. Will the cell potential increase, decrease, or stay the same? Justify your answer.
(g) In a separate electrolytic cell, a current of 0.500 A is passed through {AgNO3}(aq) for 2.00 hours. Calculate the mass of silver deposited.`,
    rubric: [
      { pts: 1, t: '(a) Anode: nickel. Cathode: silver.', kw: ['ni.{0,40}anode|anode.{0,40}ni', 'ag.{0,40}cathode|cathode.{0,40}(ag|silver)'] },
      { pts: 1, t: '(b) Ni(s) + 2Ag⁺(aq) → Ni²⁺(aq) + 2Ag(s).', kw: ['2 ?ag', 'ni'] },
      { pts: 1, t: '(c) E°cell = 0.80 − (−0.25) = +1.05 V.', num: [1.05, 0.01] },
      { pts: 1, t: '(d) ΔG° = −nFE° with n = 2.', kw: ['n ?= ?2|2 ?mol|\\(2\\)|2 ?×|2 ?x|2\\(96'] },
      { pts: 1, t: '(d) ΔG° = −(2)(96,485)(1.05) = −2.03 × 10⁵ J/mol = −203 kJ/mol (units required).', kw: ['20[23]|2\\.0[23] ?(×|x|\\*)', 'kj|j/mol|j'] },
      { pts: 1, t: '(e) Electrons flow from Ni to Ag through the wire; K⁺ ions move toward the silver (cathode) compartment.', kw: ['ni.{0,30}(to|toward).{0,30}ag|from (the )?ni', 'k\\+|k⁺|cation|potassium'] },
      { pts: 1, t: '(f) The cell potential decreases.', kw: ['decrease|lower|smaller|less'] },
      { pts: 1, t: '(f) Q = [Ni²⁺]/[Ag⁺]² increases, so E = E° − (RT/nF)ln Q decreases (or: less Ag⁺ reactant lowers the driving force).', kw: ['q|reactant|le chatelier|nernst'] },
      { pts: 1, t: '(g) q = It = 0.500 A × 7200 s = 3600 C; mol e⁻ = 3600/96,485 = 0.0373 mol.', num: [0.0373, 0.02] },
      { pts: 1, t: '(g) Ag⁺ + e⁻ → Ag: 0.0373 mol Ag × 107.87 g/mol = 4.03 g.', num: [4.03, 0.02] },
    ],
    sample: `(a) Nickel is the anode (oxidized). Silver is the cathode (Ag+ is reduced), because Ag+ has the higher reduction potential.
(b) Ni(s) + 2Ag+(aq) → Ni2+(aq) + 2Ag(s)
(c) E°cell = E°cathode − E°anode = 0.80 − (−0.25) = +1.05 V
(d) n = 2 mol e−. ΔG° = −nFE° = −(2)(96,485 C/mol)(1.05 V) = −2.03 × 10^5 J/mol = −203 kJ/mol.
(e) Electrons flow through the wire from the nickel electrode to the silver electrode. K+ ions move through the salt bridge toward the silver (cathode) half-cell to replace the Ag+ ions being removed.

(g) q = It = (0.500 A)(7200 s) = 3600 C. mol e− = 3600 ÷ 96,485 = 0.0373 mol. Each Ag+ needs 1 e−, so 0.0373 mol Ag × 107.87 g/mol = 4.03 g Ag.` }] });

CASE({ id: 'chem-l-nitrite', band: 'chem-long', label: 'Long free response', max: 10, units: ['1', '2', '8'], title: 'Nitrogen, nitrite, and nitrate',
  intro: `Nitrogen forms the oxyanions nitrite, {NO2^-}, and nitrate, {NO3^-}. The corresponding acids are nitrous acid, {HNO2} (K<sub>a</sub> = 4.0 × 10^(−4)), and nitric acid, {HNO3} (a strong acid).`,
  docs: [],
  prompts: [{ id: 'chem-l-nitrite-1', cat: 'FRQ',
    q: `(a) Draw the Lewis electron-dot diagram for {NO2^-}, including any resonance structures.
(b) Predict whether the O–N–O bond angle in {NO2^-} is greater than, less than, or equal to 120°. Justify your answer.
(c) Identify the hybridization of the nitrogen atom in {NO2^-}.
(d) Is the N–O bond in {NO2^-} longer than, shorter than, or the same length as the N–O bond in {NO3^-}? Justify your answer using bond order.
(e) Describe the photoelectron spectrum of a nitrogen atom: the number of peaks and their relative heights.
(f) The first ionization energy of nitrogen is greater than that of oxygen. Explain this using electron configurations.
(g) Which is the stronger acid, {HNO2} or {HNO3}? Justify your answer in terms of molecular structure.`,
    rubric: [
      { pts: 1, t: '(a) Two resonance structures, each with one N=O and one N–O⁻, a lone pair on N, and 18 valence electrons.', kw: ['resonance|two structures|↔|<->'] },
      { pts: 1, t: '(b) Less than 120°, because the lone pair on N repels the bonding domains more strongly.', kw: ['less|smaller|<', 'lone pair'] },
      { pts: 1, t: '(c) sp² hybridized.', kw: ['sp2|sp\\^2|sp²'] },
      { pts: 1, t: '(d) Shorter in NO₂⁻.', kw: ['shorter'] },
      { pts: 1, t: '(d) Bond order 1.5 in NO₂⁻ versus 1.33 in NO₃⁻; higher bond order means a shorter bond.', kw: ['1\\.5|3/2|one and a half', '1\\.33|4/3'] },
      { pts: 1, t: '(e) Three peaks (1s, 2s, 2p).', kw: ['three|3 peaks'] },
      { pts: 1, t: '(e) Relative heights 2 : 2 : 3, with the 1s peak at the highest binding energy.', kw: ['2 ?: ?2 ?: ?3|2, ?2, ?(and )?3'] },
      { pts: 1, t: '(f) N (2p³) has three unpaired 2p electrons; in O (2p⁴) one 2p orbital holds a pair.', kw: ['2p3|2p\\^3|2p³', '2p4|2p\\^4|2p⁴|pair'] },
      { pts: 1, t: '(f) Repulsion between the paired electrons in O makes one easier to remove, lowering O’s first ionization energy.', kw: ['repul'] },
      { pts: 1, t: '(g) HNO₃: the extra O atom withdraws electron density and NO₃⁻ delocalizes the negative charge over three O atoms, stabilizing the conjugate base.', kw: ['hno3', 'oxygen|o atoms|electronegativ|delocaliz|resonance|stabiliz'] },
    ],
    sample: `(a) [O=N–O]− ↔ [O–N=O]−. N has one lone pair; the single-bonded O has three lone pairs and the double-bonded O has two. Total 18 valence electrons.
(b) Less than 120°. N has three electron domains (trigonal planar arrangement), but one is a lone pair, which repels the two bonding domains more strongly and squeezes the O–N–O angle below 120°.
(c) sp2
(d) Shorter in NO2−. Resonance spreads one π bond over two N–O bonds in NO2− (bond order 1.5) but over three bonds in NO3− (bond order 1.33). A higher bond order means a shorter bond.
(e) Three peaks: 1s, 2s, and 2p, with relative heights 2 : 2 : 3. The 1s peak has by far the highest binding energy.
(f) N is 1s2 2s2 2p3, with three unpaired 2p electrons. O is 1s2 2s2 2p4, so one 2p orbital contains a pair. Repulsion between the paired electrons makes one of them easier to remove, so O's first ionization energy is lower.
(g) HNO3 is stronger. The additional O atom pulls electron density away from the O–H bond, and the negative charge of NO3− is delocalized over three O atoms, which stabilizes the conjugate base more than NO2−.` }] });

CASE({ id: 'chem-s-beer', band: 'chem-short', label: 'Short free response', max: 4, units: ['3'], title: 'Beer’s law and copper(II) ions',

      { pts: 1, t: '(d) Too low: the water dilutes the sample, lowering its absorbance and so the calculated concentration.', kw: ['too low|lower|less|underestim', 'dilut'] },

P('p1-mr-pendulum', 'p1-mr', 'Mathematical routines', 10, ['3', '4'], 'Ballistic pendulum',

    { pts: 1, t: '(d) Combines both principles: v = √(2gh) after the collision and mv₀ = (m + M)v.', kw: ['√|sqrt|root|\\^ ?0?\\.5|2 ?g ?h'] },

    { pts: 1, t: '(e) No net external horizontal force acts during the brief collision, so total momentum is conserved.', kw: ['external|no net|isolated|internal'] },

P('p1-tbr-ramp', 'p1-tbr', 'Translation between representations', 12, ['1', '3'], 'A cart rolling up and back down a ramp',

(d) The distance traveled up the ramp equals the area under the v–t graph from 0 to t1, a triangle with area ½v0t1. The slope of the line is −g sin θ, so t1 = v0/(g sin θ). The area is ½v0 · v0/(g sin θ) = v0²/(2g sin θ), which matches part (c).`);

P('p1-tbr-loop', 'p1-tbr', 'Translation between representations', 12, ['2'], 'A ball swung in a vertical circle',
  `A ball of mass m is attached to a light string of length R and swung in a vertical circle. At the top of the circle, its speed is v<sub>T</sub>; at the bottom, its speed is v<sub>B</sub>.`,

  [
    { pts: 1, t: '(a) Top: tension and weight both point down (toward the center).', kw: ['top', 'down|toward the center'] },
    { pts: 1, t: '(a) Bottom: tension up (toward the center), weight down.', kw: ['bottom', 'up'] },
    { pts: 1, t: '(a) No extra forces (no centripetal force drawn as a separate force).', kw: ['only|two forces|tension and (weight|gravity)'] },
    { pts: 1, t: '(b) Newton’s second law at the top: T + mg = mv²/R.', kw: ['mv\\^?2 ?/ ?r|mv²/r|centripetal'] },
    { pts: 1, t: '(b) Minimum speed occurs when T = 0.', kw: ['t ?= ?0|tension (is )?zero|no tension'] },
    { pts: 1, t: '(b) v<sub>min</sub> = √(gR).', kw: ['√ ?\\(?g ?r|sqrt\\(?g ?r|\\(g ?r\\)'] },
    { pts: 1, t: '(c) Straight line with positive slope.', kw: ['straight|linear', 'positive|increas'] },
    { pts: 1, t: '(c) Vertical intercept at mg; slope m/R (from T = mg + mv²/R).', kw: ['intercept', 'mg'] },
    { pts: 1, t: '(c) Graph consistent with T<sub>B</sub> = mg + (m/R)v<sub>B</sub>².', kw: ['m/r|slope'] },
    { pts: 1, t: '(d) At the bottom, the net force must point up toward the center.', kw: ['net force', 'up|center|centripetal'] },
    { pts: 1, t: '(d) So the upward tension must exceed the downward weight by mv²/R.', kw: ['greater|exceed|larger|more than'] },
    { pts: 1, t: '(d) The graph shows T<sub>B</sub> > mg for every nonzero speed (the line starts at mg and rises).', kw: ['intercept|starts at mg|above mg|every|any speed'] },

  `(a) Top: two arrows pointing down, tension T and weight mg. Bottom: tension T pointing up and weight mg pointing down. No separate "centripetal force" arrow.

P('p1-lab-spring', 'p1-lab', 'Experimental design and analysis', 10, ['2', '7'], 'Measuring a spring constant',
  `Students want to determine the spring constant k of a spring. They have the spring, a stand, a set of slotted masses, and a meterstick. They hang different masses from the spring and record its stretch from the unloaded length.\n\n` + T([['Hanging mass (kg)', '0.10', '0.20', '0.30', '0.40', '0.50'], ['Stretch (m)', '0.024', '0.051', '0.074', '0.099', '0.126']]),
  `(a) Describe a procedure the students could use to collect these data. Include how they would reduce experimental uncertainty.
(b) Identify the quantities the students should graph to obtain a straight line whose slope can be used to find k.
(c) Plot the data on a graph of your chosen quantities and draw a best-fit line. (Describe the graph if you cannot draw it.)
(d) Using your graph, calculate k.
(e) Describe ONE source of experimental error and how it would affect the calculated value of k.`,
  [
    { pts: 1, t: '(a) Measures the unstretched length, then hangs each mass and measures the new length (stretch = difference).', kw: ['unstretch|initial length|original length|without mass|no mass|zero'] },
    { pts: 1, t: '(a) Uses the meterstick at eye level and measures each stretch for several different masses.', kw: ['meterstick|ruler|measure'] },
    { pts: 1, t: '(a) Repeats trials (or removes and re-hangs masses) and averages to reduce uncertainty.', kw: ['repeat|average|multiple trials|several trials'] },
    { pts: 1, t: '(b) Graph spring force (weight mg) on the vertical axis vs. stretch x on the horizontal axis (or x vs. mg).', kw: ['mg|weight|force', 'stretch|x|extension'] },
    { pts: 1, t: '(b) Slope = k (or 1/k for the inverted graph).', kw: ['slope'] },
    { pts: 1, t: '(c) Points plotted correctly with a straight best-fit line through or near the origin.', kw: ['best.?fit|straight|line'] },
    { pts: 1, t: '(d) Uses points on the best-fit line (not single data points) to find the slope.', kw: ['slope|rise|line'] },
    { pts: 1, t: '(d) k ≈ 39 N/m (accept 37–41 N/m).', num: [39, 0.05] },
    { pts: 1, t: '(e) A plausible error, such as parallax when reading the meterstick, the spring oscillating, or the spring’s own mass.', kw: ['parallax|reading|oscillat|bounc|mass of the spring|eye|zero'] },
    { pts: 1, t: '(e) A correct description of how that error changes k.', kw: ['too (high|low|large|small)|overestimat|underestimat|larger|smaller|higher|lower'] },
  ],
  `(a) Clamp the spring to the stand and measure its unstretched length with the meterstick at eye level. Hang 0.10 kg, wait for it to stop moving, and measure the new length; the stretch is the difference. Repeat for 0.20 through 0.50 kg. Do three trials for each mass, removing and re-hanging it, and average the stretches.
(b) Graph the spring force F = mg (vertical axis) versus the stretch x (horizontal axis). From F = kx, the slope is k.
(c) Forces: 0.98, 1.96, 2.94, 3.92, 4.90 N, plotted against 0.024 to 0.126 m. The points lie close to a straight line through the origin.
(d) Using two points on the best-fit line, (0.020 m, 0.78 N) and (0.120 m, 4.68 N): slope = 3.90 N / 0.100 m = 39 N/m, so k ≈ 39 N/m.
(e) If the students read the meterstick from above (parallax), they might record stretches that are too large. Larger x values for the same force make the slope, and so k, too small.`);

P('p1-lab-pendulum', 'p1-lab', 'Experimental design and analysis', 10, ['7'], 'Finding g with a pendulum',
  `Students use a simple pendulum to determine the acceleration due to gravity. They vary the length L and measure the period T.\n\n` + T([['L (m)', '0.20', '0.40', '0.60', '0.80', '1.00'], ['T (s)', '0.90', '1.27', '1.55', '1.79', '2.01']]),
  `(a) Describe how the students should measure the period for each length to minimize uncertainty.
(b) Identify the quantities to graph to produce a straight line, and state how g can be found from its slope.
(c) Using the data, plot your chosen quantities and draw a best-fit line. (Describe the graph if you cannot draw it.)
(d) Calculate g from your graph.
(e) Explain why the students should keep the release angle small.`,
  [
    { pts: 1, t: '(a) Times many oscillations (e.g., 10) and divides by that number.', kw: ['10|ten|several|many|multiple', 'oscillation|swing|cycle'] },
    { pts: 1, t: '(a) Repeats trials and averages; starts timing at a consistent point (e.g., the lowest point).', kw: ['repeat|average|trials|lowest point|same point'] },
    { pts: 1, t: '(a) Measures L from the pivot to the center of the bob.', kw: ['center of (the )?(bob|mass)|pivot'] },
    { pts: 1, t: '(b) Graph T² vs. L.', kw: ['t\\^?2|t²|period squared'] },
    { pts: 1, t: '(b) Slope = 4π²/g, so g = 4π²/slope.', kw: ['4 ?π|4 ?pi|4pi'] },
    { pts: 1, t: '(c) T² values (0.81, 1.61, 2.40, 3.20, 4.04 s²) plotted against L with a straight best-fit line.', kw: ['0\\.81|1\\.61|2\\.40|3\\.20|4\\.04|best.?fit|straight'] },
    { pts: 1, t: '(d) Slope ≈ 4.0 s²/m from the best-fit line.', num: [4.03, 0.04] },
    { pts: 1, t: '(d) g = 4π²/slope ≈ 9.8 m/s² (accept 9.6–10.0).', num: [9.8, 0.025] },

    { pts: 1, t: '(e) At larger angles the period is longer than predicted, which would make the calculated g too small.', kw: ['longer|larger period|increase|too (small|low)|not simple harmonic'] },
  ],
  `(a) Release the bob from a small angle and time 10 complete oscillations with a stopwatch, starting and stopping as the bob passes the lowest point. Divide by 10. Repeat three times for each length and average. Measure L from the pivot to the center of the bob.
(b) Graph T² (vertical) versus L (horizontal). Since T = 2π√(L/g), T² = (4π²/g)L, so the slope is 4π²/g and g = 4π²/slope.
(c) T² values: 0.81, 1.61, 2.40, 3.20, 4.04 s². These lie on a straight line through the origin.
(d) Slope = (4.04 − 0.81)/(1.00 − 0.20) = 4.04 s²/m. g = 4π²/4.04 = 9.8 m/s².

P('p1-qqt-pulley', 'p1-qqt', 'Qualitative/quantitative translation', 8, ['2'], 'A block pulled by a hanging mass',
  `Block 1 (mass m₁) sits on a horizontal frictionless table. A light string attached to it passes over a light, frictionless pulley at the table's edge to block 2 (mass m₂), which hangs freely. The blocks are released from rest.`,
  `(a) Without writing or using equations, explain how the acceleration of the blocks would change if the mass of block 1 were increased while m₂ stays the same.
(b) Derive an expression for the acceleration of the blocks in terms of m₁, m₂, and physical constants.
(c) Explain how your expression in part (b) is consistent with your reasoning in part (a).`,
  [
    { pts: 1, t: '(a) The acceleration decreases.', kw: ['decrease|smaller|less|slower'] },
    { pts: 1, t: '(a) The pulling force (weight of block 2) is unchanged.', kw: ['same|unchanged|block 2|hanging|weight'] },
    { pts: 1, t: '(a) That same force must now accelerate more total mass (more inertia).', kw: ['more mass|more inertia|greater mass|total mass|heavier'] },
    { pts: 1, t: '(b) Newton’s second law for each block or the system: m₂g − T = m₂a and T = m₁a.', kw: ['t ?=|m ?2 ?g|m2g|system'] },
    { pts: 1, t: '(b) Combines correctly (or treats the system as a whole).', kw: ['m ?1 ?\\+ ?m ?2|m₁ ?\\+ ?m₂|total mass|combin|add'] },
    { pts: 1, t: '(b) a = m₂g/(m₁ + m₂).', kw: ['m ?2 ?g ?/|m₂g/|m2g ?/'] },
    { pts: 1, t: '(c) m₁ appears only in the denominator.', kw: ['denominator|bottom'] },
    { pts: 1, t: '(c) So increasing m₁ decreases a, matching part (a).', kw: ['decrease|smaller|consistent|match|agree'] },
  ],
  `(a) The acceleration decreases. The only force that drives the system is the weight of the hanging block 2, which does not change. That same driving force now has to accelerate more total mass, so the system speeds up more slowly.
(b) Block 2: m2g − T = m2a. Block 1: T = m1a. Adding: m2g = (m1 + m2)a, so a = m2g/(m1 + m2).
(c) m1 appears only in the denominator. Increasing m1 makes the denominator larger while the numerator m2g stays the same, so a decreases, which matches part (a).`);

P('p1-qqt-float', 'p1-qqt', 'Qualitative/quantitative translation', 8, ['8'], 'A block floating in fresh water and salt water',

  ],

/* AP Physics 2 · Units 9–15 (original). */
(() => {
const [, S, H] = pool('p2');
const T = rows => `<div class="tablewrap"><table class="data">${rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('')}</table></div>`;

/* ───────────── Unit 9: Thermodynamics ───────────── */
S('9', `When the absolute temperature of an ideal gas doubles, the average kinetic energy of its molecules`,
  [`doubles`, `quadruples`, `increases by a factor of √2`, `stays the same`],
  `K<sub>avg</sub> = (3/2)k<sub>B</sub>T, so average kinetic energy is proportional to absolute temperature.`);
S('9', `A gas is compressed at constant temperature to half its volume. Its pressure`,
  [`doubles`, `is halved`, `quadruples`, `does not change`],
  `At constant n and T, PV is constant (Boyle's law), so halving V doubles P.`);
H('9', `A gas absorbs 300 J of heat while 100 J of work is done ON it. What is its change in internal energy?`,
  [`+400 J`, `+200 J`, `−200 J`, `+300 J`],
  `ΔU = Q + W with W = work done on the gas: 300 + 100 = 400 J.`);
H('9', `A gas expands at a constant pressure of 2.0 × 10⁵ Pa from 0.010 m³ to 0.030 m³. How much work is done ON the gas?`,
  [`−4.0 × 10³ J`, `+4.0 × 10³ J`, `−6.0 × 10³ J`, `+2.0 × 10³ J`],
  `W = −PΔV = −(2.0 × 10⁵)(0.020) = −4000 J. The gas does positive work on its surroundings.`);
S('9', `In an isothermal process for an ideal gas,`,
  [`the internal energy does not change`, `no heat is exchanged`, `the volume stays constant`, `the pressure stays constant`],
  `Internal energy of an ideal gas depends only on temperature, so ΔU = 0 and Q = −W.`);
S('9', `In an adiabatic process,`,
  [`no heat is exchanged with the surroundings`, `the temperature stays constant`, `no work is done on or by the gas`, `the pressure stays constant`],
  `Adiabatic means Q = 0, so ΔU = W.`);
H('9', `On a PV diagram, a gas goes clockwise around a closed cycle. Which statement is correct for one full cycle?`,
  [`The gas does net positive work, equal to the enclosed area.`, `The net work done by the gas is zero.`, `The gas’s internal energy increases by the enclosed area.`, `The net heat absorbed by the gas is zero.`],
  `For a cycle, ΔU = 0. Clockwise cycles do net positive work on the surroundings, equal to the enclosed area, so the gas absorbs an equal net amount of heat.`);
S('9', `Heat conduction through a wall increases when`,
  [`the temperature difference across it increases`, `the wall is made thicker`, `the wall’s area is reduced`, `a material with lower conductivity is used`],
  `Q/Δt = kAΔT/L: larger ΔT, larger area, or thinner walls increase the rate.`);
H('9', `A rigid sealed container of ideal gas is heated from 300 K to 450 K. Its pressure changes from 1.0 atm to`,
  [`1.5 atm`, `0.67 atm`, `2.25 atm`, `1.0 atm`],
  `At constant V and n, P ∝ T: 1.0 × 450/300 = 1.5 atm.`);
S('9', `The second law of thermodynamics states that the total entropy of an isolated system`,
  [`never decreases`, `always decreases`, `always remains zero`, `depends only on its volume`],
  `In any real process in an isolated system, entropy increases (or stays the same for an ideal reversible process).`);
H('9', `Two gases, helium and argon, are at the same temperature. Which statement is correct?`,

/* AP Physics C: Electricity and Magnetism (original). k = 8.99 × 10⁹ N·m²/C², ε₀ = 8.85 × 10⁻¹² C²/(N·m²), μ₀ = 4π × 10⁻⁷ T·m/A. */
(() => {
const [, S, H] = pool('pce');
const T = rows => `<div class="tablewrap"><table class="data">${rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('')}</table></div>`;

/* ───────────── Unit 8: Electric Charges, Fields, and Gauss's Law ───────────── */
S('8', `Gauss's law states that the electric flux through a closed surface equals`,
  [`the enclosed charge divided by ε₀`, `the total charge everywhere divided by ε₀`, `zero for every closed surface`, `the electric field times the enclosed charge`],
  `∮E·dA = Q<sub>enc</sub>/ε₀. Charges outside the surface contribute zero net flux.`);
H('8', `Using Gauss's law, the electric field a distance r from an infinitely long line of charge with linear density λ is`,
  [`λ/(2πε₀r)`, `λ/(4πε₀r²)`, `λ/(ε₀r)`, `λr/(2ε₀)`],
  `A cylindrical Gaussian surface of length L gives E(2πrL) = λL/ε₀.`);
H('8', `The electric field just outside a large, flat sheet with uniform surface charge density σ (not a conductor) is`,
  [`σ/(2ε₀)`, `σ/ε₀`, `σ/(4πε₀)`, `zero`],
  `A Gaussian "pillbox" through the sheet has flux on both faces: 2EA = σA/ε₀.`);
S('8', `Inside a charged conducting sphere at electrostatic equilibrium, the electric field is`,
  [`zero`, `uniform and nonzero`, `strongest at the center`, `directed outward`],
  `Free charges move until the field inside the conductor vanishes; excess charge sits on the surface.`);
H('8', `A uniformly charged insulating sphere has radius R and total charge Q. The field magnitude at r < R is`,
  [`kQr/R³`, `kQ/r²`, `kQ/R²`, `zero`],
  `Enclosed charge is Q(r/R)³, so E = k(Qr³/R³)/r² = kQr/R³, growing linearly with r inside.`);
S('8', `The electric flux through a closed surface containing a +3.0 µC charge and a −1.0 µC charge is`,
  [`2.3 × 10⁵ N·m²/C`, `4.5 × 10⁵ N·m²/C`, `0`, `1.1 × 10⁵ N·m²/C`],
  `Φ = Q<sub>enc</sub>/ε₀ = (2.0 × 10⁻⁶)/(8.85 × 10⁻¹²) = 2.3 × 10⁵ N·m²/C.`);
H('8', `A ring of radius a carries total charge Q uniformly. The field on its axis at distance x from the center is`,
  [`kQx/(x² + a²)^(3/2)`, `kQ/(x² + a²)`, `kQ/x²`, `kQa/(x² + a²)^(3/2)`],
  `Perpendicular components cancel; the axial components add: dE<sub>x</sub> = k dq x/(x² + a²)^(3/2), integrated over Q.`);
S('8', `Two charges, +4.0 µC and +1.0 µC, are 0.30 m apart. Where between them is the electric field zero?`,
  [`0.20 m from the +4.0 µC charge`, `0.15 m from each charge`, `0.10 m from the +4.0 µC charge`, `There is no such point`],
  `k(4)/x² = k(1)/(0.30 − x)² → 2/x = 1/(0.30 − x) → x = 0.20 m.`);
H('8', `A spherical shell of radius R carries charge Q. A point charge q sits at its center. The field at r > R is`,
  [`k(Q + q)/r²`, `kq/r², from the center charge only`, `kQ/r², from the shell only`, `zero, because the shell shields it`],
  `A Gaussian sphere outside encloses Q + q.`);
S('8', `Electric field lines`,
  [`begin on + charges and end on − charges`, `form closed loops around every charge`, `can cross wherever two fields overlap`, `point toward positive charges and away from negative ones`],
  `Field lines show the direction of force on a positive test charge.`);
H('8', `A charged particle (q, m) enters a uniform electric field E perpendicular to its velocity v₀ and travels a horizontal distance L. Its vertical deflection is`,
  [`qEL²/(2mv₀²)`, `qEL/(mv₀)`, `qEL²/(mv₀²)`, `mv₀²/(2qEL)`],

/* ───────────── Unit 9: Electric Potential ───────────── */
S('9', `The electric potential 0.20 m from a 4.0 nC point charge is`,
  [`180 V`, `900 V`, `36 V`, `0.18 V`],
  `V = kq/r = (8.99 × 10⁹)(4.0 × 10⁻⁹)/0.20 = 180 V.`);
H('9', `The potential in a region is V(x) = 3x² − 2x (SI). What is the electric field at x = 1 m?`,

  `ΔK = qΔV = (1.6 × 10⁻¹⁹)(400) = 6.4 × 10⁻¹⁷ J; v = √(2K/m) = 2.8 × 10⁵ m/s.`);

/* ───────────── Unit 10: Conductors and Capacitors ───────────── */
S('10', `The capacitance of a parallel-plate capacitor increases when`,
  [`the plate area increases`, `the plate separation increases`, `the stored charge increases`, `the voltage increases`],
  `C = κε₀A/d depends only on geometry and the dielectric.`);
H('10', `A dielectric (κ = 3) fills an isolated charged capacitor (not connected to a battery). The potential difference across it`,

P('pce-tbr-rail', 'pce-tbr', 'Translation between representations', 12, ['13'], 'A rod sliding on rails',
  `A conducting rod of mass m and length ℓ slides without friction on two horizontal rails connected at one end by a resistor R. A uniform magnetic field B points vertically through the circuit. At t = 0 the rod has speed v₀ and is then left to coast.`,
  `(a) Draw a free-body diagram for the rod while it moves (horizontal forces only is acceptable).
